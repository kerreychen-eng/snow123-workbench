<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snow123 雪球站外导航 · 内部工作台</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #f5fafd;
  --bg-card: #ffffff;
  --bg-elevated: #eaf6fb;
  --bg-deep: #d9eef7;
  --border: #d4ebf5;
  --border-light: #b8dcec;
  --text: #1f3a4a;
  --text-dim: #4a6b7d;
  --text-muted: #7a96a8;
  --accent: #5fc3e7;
  --accent-light: #8ed5ee;
  --accent-dark: #3ba5cc;
  --accent-deeper: #1a7ea8;
  --orange: #f88906;
  --orange-dark: #d57400;
  --danger: #e74c3c;
  --success: #27ae60;
  --warning: #f39c12;
  --info: #3498db;
}

body {
  font-family: 'PingFang SC', 'Microsoft YaHei', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  font-size: 14px;
  line-height: 1.6;
}

/* ============== 顶部全局导航 ============== */
.topbar {
  background: white;
  border-bottom: 1px solid var(--border);
  padding: 0 32px;
  height: 60px;
  display: flex;
  align-items: center;
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  box-shadow: 0 1px 3px rgba(95, 195, 231, 0.08);
}

.topbar-logo {
  height: 36px;
  margin-right: 32px;
}

.topbar-modules {
  display: flex;
  gap: 4px;
  flex: 1;
}

.module-tab {
  padding: 8px 18px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 14px;
  color: var(--text-dim);
  font-weight: 500;
  transition: all 0.15s;
  display: flex;
  align-items: center;
  gap: 8px;
}

.module-tab:hover { background: var(--bg-elevated); color: var(--text); }
.module-tab.active {
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
  color: white;
  box-shadow: 0 2px 6px rgba(95, 195, 231, 0.3);
}
.module-tab .icon { font-size: 16px; }

.topbar-user {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 13px;
  color: var(--text-dim);
}

.role-dropdown {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 6px 10px;
  border-radius: 6px;
  font-size: 13px;
  cursor: pointer;
  font-family: inherit;
}

/* ============== 主内容区域 ============== */
.app {
  display: flex;
  min-height: 100vh;
  padding-top: 60px;
}

.sidebar {
  width: 220px;
  background: var(--bg-card);
  border-right: 1px solid var(--border);
  padding: 20px 0;
  position: fixed;
  top: 60px; bottom: 0;
  overflow-y: auto;
}

.module-banner {
  margin: 0 16px 16px;
  padding: 14px;
  border-radius: 10px;
  color: white;
  text-align: center;
}

.module-banner.analytics { background: linear-gradient(135deg, #5fc3e7, #3ba5cc); }
.module-banner.finance { background: linear-gradient(135deg, #f88906, #d57400); }
.module-banner.quote { background: linear-gradient(135deg, #1a7ea8, #0e5478); }

.module-banner-title { font-size: 14px; font-weight: 600; }
.module-banner-sub { font-size: 11px; opacity: 0.85; margin-top: 4px; letter-spacing: 1px; }

.nav-section { padding: 4px 12px; }

.nav-title {
  font-size: 10px;
  color: var(--text-muted);
  padding: 12px 12px 6px;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  font-weight: 600;
}

.nav-item {
  padding: 9px 14px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  color: var(--text-dim);
  display: flex;
  align-items: center;
  justify-content: space-between;
  transition: all 0.15s;
}

.nav-item:hover { background: var(--bg-elevated); color: var(--text); }
.nav-item.active {
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
  color: white;
  font-weight: 500;
}
.nav-item .badge {
  font-size: 11px;
  background: var(--bg-deep);
  color: var(--text-dim);
  padding: 1px 7px;
  border-radius: 10px;
}
.nav-item.active .badge { background: rgba(255,255,255,0.25); color: white; }
.nav-icon { width: 18px; text-align: center; margin-right: 6px; display: inline-block; }

.main {
  flex: 1;
  margin-left: 220px;
  padding: 28px 36px;
  max-width: 1500px;
}

/* ============== 通用组件 ============== */
.page-header {
  margin-bottom: 24px;
  padding-bottom: 16px;
  border-bottom: 2px solid var(--accent);
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
}

.page-title {
  font-size: 24px;
  font-weight: 700;
  color: var(--accent-deeper);
}

.page-desc {
  color: var(--text-dim);
  font-size: 13px;
  margin-top: 6px;
}

.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 20px;
  margin-bottom: 16px;
}

.card-title {
  font-size: 13px;
  font-weight: 500;
  color: var(--text-dim);
  margin-bottom: 14px;
  text-transform: uppercase;
  letter-spacing: 1px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.btn {
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
  color: white;
  border: none;
  padding: 8px 16px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  font-family: inherit;
  transition: all 0.15s;
}

.btn:hover { background: linear-gradient(135deg, var(--accent-dark) 0%, var(--accent-deeper) 100%); }

.btn-orange {
  background: linear-gradient(135deg, var(--orange) 0%, var(--orange-dark) 100%);
}
.btn-orange:hover { background: var(--orange-dark); }

.btn-secondary {
  background: var(--bg-elevated);
  color: var(--text-dim);
  border: 1px solid var(--border);
}
.btn-secondary:hover { background: var(--bg-deep); color: var(--text); }
.btn-danger { background: var(--danger); color: white; }
.btn-sm { padding: 5px 11px; font-size: 12px; }

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-bottom: 12px;
}

.form-group { display: flex; flex-direction: column; }
.form-label { font-size: 12px; color: var(--text-dim); margin-bottom: 6px; font-weight: 500; }
.form-label .required { color: var(--danger); }

.form-input, .form-select {
  background: white;
  border: 1px solid var(--border);
  color: var(--text);
  padding: 9px 12px;
  border-radius: 6px;
  font-size: 13px;
  font-family: inherit;
}

.form-input:focus, .form-select:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 2px rgba(95, 195, 231, 0.15);
}

.table-wrap {
  overflow-x: auto;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 10px;
}

table { width: 100%; border-collapse: collapse; font-size: 13px; }

th {
  background: var(--bg-elevated);
  padding: 10px 14px;
  text-align: left;
  font-weight: 500;
  color: var(--text-dim);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  border-bottom: 1px solid var(--border);
}

td { padding: 11px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: rgba(95, 195, 231, 0.04); }

.tag {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 500;
}

.tag-success { background: rgba(39, 174, 96, 0.12); color: var(--success); }
.tag-danger { background: rgba(231, 76, 60, 0.12); color: var(--danger); }
.tag-warning { background: rgba(243, 156, 18, 0.12); color: var(--warning); }
.tag-info { background: rgba(95, 195, 231, 0.12); color: var(--accent-deeper); }
.tag-orange { background: rgba(248, 137, 6, 0.12); color: var(--orange-dark); }
.tag-muted { background: var(--bg-elevated); color: var(--text-muted); }

.stats-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
  margin-bottom: 20px;
}

.stat-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px;
  border-top: 3px solid var(--accent);
}

.stat-card.orange { border-top-color: var(--orange); }
.stat-card.danger { border-top-color: var(--danger); }
.stat-card.success { border-top-color: var(--success); }
.stat-card.warning { border-top-color: var(--warning); }

.stat-label {
  font-size: 11px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 1px;
}

.stat-value {
  font-size: 24px;
  font-weight: 700;
  margin-top: 4px;
  font-feature-settings: 'tnum';
}

.stat-trend {
  font-size: 11px;
  color: var(--text-dim);
  margin-top: 2px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.trend-up { color: var(--success); }
.trend-down { color: var(--danger); }

.alert-bar {
  border-left: 3px solid;
  padding: 12px 16px;
  border-radius: 6px;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 13px;
}

.alert-bar.danger {
  background: rgba(231, 76, 60, 0.06);
  border-left-color: var(--danger);
}

.alert-bar.info {
  background: rgba(95, 195, 231, 0.06);
  border-left-color: var(--accent);
}

.alert-bar.warning {
  background: rgba(243, 156, 18, 0.06);
  border-left-color: var(--warning);
}

.empty {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-muted);
}

.empty-icon { font-size: 44px; margin-bottom: 12px; opacity: 0.4; }

.amount {
  font-feature-settings: 'tnum';
  font-variant-numeric: tabular-nums;
}

.text-mono {
  font-family: 'SF Mono', Monaco, monospace;
  font-size: 12px;
  color: var(--text-dim);
}

.rank-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: var(--bg-elevated);
  color: var(--text-dim);
  font-size: 12px;
  font-weight: 600;
}

.rank-badge.top1 { background: linear-gradient(135deg, #f4d03f, #f88906); color: white; }
.rank-badge.top2 { background: linear-gradient(135deg, #c0c0c0, #95a5a6); color: white; }
.rank-badge.top3 { background: linear-gradient(135deg, #cd7f32, #a87328); color: white; }
.rank-badge.bottom { background: rgba(231, 76, 60, 0.15); color: var(--danger); }

/* Modal */
.modal-mask {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(31, 58, 74, 0.5);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}

.modal {
  background: var(--bg-card);
  border-radius: 12px;
  width: 90%;
  max-width: 600px;
  max-height: 90vh;
  overflow-y: auto;
  padding: 28px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.15);
}

.modal-title { font-size: 18px; font-weight: 600; margin-bottom: 20px; color: var(--accent-deeper); }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

.help-text {
  background: rgba(95, 195, 231, 0.06);
  border-left: 3px solid var(--accent);
  padding: 12px 14px;
  border-radius: 6px;
  margin-top: 14px;
  font-size: 12px;
  color: var(--text-dim);
  line-height: 1.7;
}

.flex-between { display: flex; justify-content: space-between; align-items: center; }

/* ============== 报价模块特有 ============== */
.search-bar {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px 14px;
  display: flex;
  gap: 10px;
  align-items: center;
  margin-bottom: 14px;
}

.search-input {
  flex: 1;
  border: none;
  background: transparent;
  font-size: 14px;
  outline: none;
  color: var(--text);
  font-family: inherit;
}

.filter-tags {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}

.filter-tag {
  padding: 5px 11px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 16px;
  font-size: 12px;
  color: var(--text-dim);
  cursor: pointer;
  transition: all 0.15s;
}

.filter-tag:hover { border-color: var(--accent); color: var(--accent-dark); }
.filter-tag.active { background: var(--accent); color: white; border-color: var(--accent); }

.items-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 12px;
}

.item-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px 16px;
  position: relative;
  display: flex;
  flex-direction: column;
}

.item-card:hover {
  border-color: var(--accent);
  box-shadow: 0 4px 12px rgba(95, 195, 231, 0.15);
}

.item-card.in-cart {
  border-color: var(--orange);
  background: linear-gradient(180deg, #fff8ee 0%, #ffffff 60%);
}

.item-card.in-cart::before {
  content: '✓ 已加入报价';
  position: absolute;
  top: 8px;
  right: 8px;
  background: var(--orange);
  color: white;
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 10px;
}

.item-cat {
  font-size: 10px;
  color: var(--accent-dark);
  text-transform: uppercase;
  letter-spacing: 1.5px;
  margin-bottom: 6px;
  font-weight: 600;
}

.item-name {
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 8px;
  cursor: pointer;
}

.item-name.clickable:hover { color: var(--accent-deeper); text-decoration: underline; }
.item-name .ext-icon { font-size: 11px; color: var(--accent); margin-left: 6px; opacity: 0.7; }

.item-meta {
  display: flex; gap: 6px; flex-wrap: wrap;
  font-size: 11px; color: var(--text-muted); margin-bottom: 8px;
}

.item-meta span {
  background: var(--bg-elevated);
  padding: 2px 8px;
  border-radius: 4px;
  color: var(--text-dim);
}

.item-desc {
  font-size: 12px;
  color: var(--text-dim);
  line-height: 1.6;
  margin-bottom: 12px;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
  flex: 1;
}

.item-bottom {
  display: flex; justify-content: space-between; align-items: center;
  margin-top: auto; padding-top: 8px; border-top: 1px dashed var(--border);
}

.item-price { font-size: 18px; font-weight: 700; color: var(--orange); }

.cart-row {
  display: grid;
  grid-template-columns: 1fr 100px 120px 100px 80px;
  gap: 14px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  align-items: center;
}

.cart-row.header {
  background: var(--bg-elevated);
  font-size: 11px;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 1px;
  font-weight: 600;
}

.qty-input {
  width: 70px;
  padding: 5px 8px;
  border: 1px solid var(--border);
  border-radius: 4px;
  text-align: center;
  font-size: 13px;
  background: white;
  font-family: inherit;
}

.quote-doc {
  background: white;
  padding: 38px;
  border-radius: 10px;
  border: 1px solid var(--border);
  margin-bottom: 16px;
}

.quote-header {
  text-align: center;
  margin-bottom: 26px;
  padding-bottom: 18px;
  border-bottom: 3px solid var(--accent);
}

.quote-logo { max-width: 280px; height: auto; margin: 0 auto; display: block; }
.quote-title { font-size: 20px; font-weight: 700; color: var(--accent-deeper); margin-top: 8px; letter-spacing: 1px; }

.quote-meta {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 22px;
  font-size: 13px;
}

.quote-meta-item {
  padding: 10px 14px;
  background: var(--bg-elevated);
  border-radius: 6px;
  border-left: 3px solid var(--accent);
}

.quote-meta-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
.quote-meta-value { font-weight: 600; color: var(--text); }

.quote-table { width: 100%; border-collapse: collapse; margin-bottom: 18px; font-size: 13px; }

.quote-table th {
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent-deeper) 100%);
  color: white;
  padding: 10px 12px;
  text-align: left;
  font-weight: 500;
  font-size: 12px;
  text-transform: none;
  letter-spacing: 0;
}

.quote-table td { padding: 11px 12px; border-bottom: 1px solid var(--border); }

.quote-total {
  display: flex; justify-content: flex-end;
  margin-top: 18px; padding-top: 14px;
  border-top: 2px solid var(--text);
  font-size: 22px; font-weight: 700;
  color: var(--orange);
}

.quote-footer {
  margin-top: 28px; padding-top: 18px;
  border-top: 1px dashed var(--border);
  font-size: 12px; color: var(--text-dim); line-height: 1.8;
}

.bar-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.bar-name { width: 110px; font-size: 13px; flex-shrink: 0; }
.bar-track { flex: 1; background: var(--bg-elevated); height: 22px; border-radius: 4px; overflow: hidden; position: relative; }
.bar-fill { height: 100%; transition: width 0.5s; }
.bar-fill::after {
  content: attr(data-value);
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  font-size: 11px; color: white; font-weight: 500;
}
.bar-percent { width: 60px; text-align: right; font-size: 12px; color: var(--text-dim); }

@media print {
  .topbar, .sidebar, .module-tab, .btn { display: none !important; }
  .main { margin-left: 0; padding: 0; }
  .app { padding-top: 0; }
}

@media (max-width: 1024px) {
  .topbar { padding: 0 16px; }
  .topbar-modules { gap: 2px; }
  .module-tab { padding: 6px 10px; font-size: 13px; }
  .topbar-user { display: none; }
}

@media (max-width: 768px) {
  .sidebar { display: none; }
  .main { margin-left: 0; padding: 16px; }
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
  .items-grid { grid-template-columns: 1fr; }
  .cart-row { grid-template-columns: 1fr; gap: 6px; }
  .form-row { grid-template-columns: 1fr; }
}

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 4px; }
</style>
</head>

function canAccessModule(moduleId, role) {
  const m = MODULES.find(x => x.id === moduleId);
  if (!m) return false;
  return m.roles.includes(role || 'boss');
}

// 获取该角色可访问的第一个模块ID(用于fallback)
function getFirstAccessibleModule(role) {
  const m = MODULES.find(x => x.roles.includes(role || 'boss'));
  return m ? m.id : 'quote';
}

// 默认数据
function getDefaultData() {
  const now = new Date();
  const months = [
    new Date(now.getFullYear(), now.getMonth() - 2, 1),
    new Date(now.getFullYear(), now.getMonth() - 1, 1),
    new Date(now.getFullYear(), now.getMonth(), 1)
  ];
  const customers = ['ABC品牌', 'XYZ卖家', '雪球科技', '蓝海电商', '海豚出海'];
  const lines = ['FB套餐', 'Deal站', 'SD红人', 'WOOT', '明信片', 'VINE', 'PR/KOL'];
  const sps = ['sp1', 'sp2', 'sp3', 'sp4'];
  const revenues = [];
  let id = 1;
  months.forEach((mDate, mi) => {
    const count = mi === 2 ? 25 : (mi === 1 ? 35 : 28);
    for (let i = 0; i < count; i++) {
      const day = Math.floor(Math.random() * 25) + 1;
      const date = mDate.getFullYear() + '-' + String(mDate.getMonth()+1).padStart(2,'0') + '-' + String(day).padStart(2,'0');
      const sp = sps[Math.floor(Math.random() * sps.length)];
      const baseAmount = sp === 'sp1' ? 3000 : sp === 'sp2' ? 1800 : sp === 'sp3' ? 1200 : 800;
      revenues.push({
        id: 'r' + (id++), date,
        salespersonId: sp,
        customer: customers[Math.floor(Math.random() * customers.length)],
        amount: Math.floor(baseAmount + Math.random() * baseAmount),
        businessLine: lines[Math.floor(Math.random() * lines.length)],
        isNewCustomer: Math.random() < 0.15
      });
    }
  });
  return revenues.sort((a,b) => a.date.localeCompare(b.date));
}

// ============== 工具函数 ==============
function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escapeAttr(s) { return escapeHtml(s).replace(/'/g, '&#39;'); }
function uid(p) { return p + '_' + Date.now() + '_' + Math.floor(Math.random()*1000); }
function today() { return new Date().toISOString().split('T')[0]; }
function nowTime() { return new Date().toTimeString().slice(0,5); }
function thisMonth() { return new Date().toISOString().slice(0,7); }
function fmt(n) { return Math.round(n).toLocaleString('zh-CN'); }

function getSpName(id) { return (data.salespeople.find(s=>s.id===id)||{}).name || '未知'; }
function getStaffName(id) { return (data.staff.find(s=>s.id===id)||{}).name || '未知'; }

function getMonthRevenues(month) { return data.revenues.filter(r => r.date.startsWith(month)); }
function getPrevMonth(month) {
  const [y, m] = month.split('-').map(Number);
  const d = new Date(y, m - 2, 1);
  return d.toISOString().slice(0,7);
}
function getYearAgoMonth(month) {
  const [y, m] = month.split('-').map(Number);
  return (y-1) + '-' + String(m).padStart(2,'0');
}
function getTrend(curr, prev) {
  if (prev === 0) return { icon: '—', class: '', text: '新增' };
  const pct = ((curr - prev) / prev * 100).toFixed(1);
  if (curr > prev) return { icon: '↑', class: 'trend-up', text: '+' + pct + '%' };
  if (curr < prev) return { icon: '↓', class: 'trend-down', text: pct + '%' };
  return { icon: '→', class: '', text: '持平' };
}

function calcCommission(amount) {
  const plan = data.commissionPlan;
  if (plan.type === 'fixed') return amount * plan.fixedRate;
  let total = 0;
  for (const tier of plan.tiers) {
    if (amount > tier.from) {
      const tierAmount = Math.min(amount, tier.to) - tier.from;
      total += Math.max(0, tierAmount) * tier.rate;
    }
    if (amount <= tier.to) break;
  }
  return total;
}

function getCommissionTier(amount) {
  const plan = data.commissionPlan;
  if (plan.type === 'fixed') return { label: '固定' + (plan.fixedRate*100).toFixed(0) + '%', rate: plan.fixedRate };
  for (const tier of plan.tiers) {
    if (amount > tier.from && amount <= tier.to) return tier;
  }
  return plan.tiers[0];
}

function parsePrice(priceStr) {
  if (!priceStr) return 0;
  const s = String(priceStr).trim();
  const match = s.match(/(\d+(?:\.\d+)?)/);
  if (!match) return 0;
  let num = parseFloat(match[1]);
  if (s.includes('美金') || s.includes('USD') || s.includes('$')) num = num * 7;
  if (s.includes('欧元') || s.includes('EUR') || s.includes('€')) num = num * 7.7;
  return num;
}

function formatPriceDisplay(item) {
  const cur = item.currency || 'CNY';
  if (cur === 'USD') {
    const m = String(item.price).match(/\d+(?:\.\d+)?/);
    return '$' + (m ? parseFloat(m[0]).toLocaleString() : '0');
  }
  if (cur === 'EUR') {
    const m = String(item.price).match(/\d+(?:\.\d+)?/);
    return '€' + (m ? parseFloat(m[0]).toLocaleString() : '0');
  }
  return '¥' + item.price;
}

function getQuoteItem(key) {

  const cat = key.substring(0, sep);
  const idx = parseInt(key.substring(sep + 1));
  return PRICE_DATA[cat] ? PRICE_DATA[cat][idx] : null;

  if (!canAccessModule(moduleId, data.role)) {

  data.currentModule = moduleId;

  if (moduleId === 'analytics') data.currentPage = 'overview';

    data.quoteCategoryPage = data.quoteCategoryPage || 'us';

  else if (moduleId === 'advisor') {

}

function renderOverview() {
  const month = data.selectedMonth;
  const prevMonth = getPrevMonth(month);
  const yearAgoMonth = getYearAgoMonth(month);

  const currRevs = getMonthRevenues(month);
  const prevRevs = getMonthRevenues(prevMonth);
  const yearAgoRevs = getMonthRevenues(yearAgoMonth);

  const currTotal = currRevs.reduce((s,r) => s+r.amount, 0);
  const prevTotal = prevRevs.reduce((s,r) => s+r.amount, 0);
  const yearAgoTotal = yearAgoRevs.reduce((s,r) => s+r.amount, 0);

  const currCustomers = new Set(currRevs.map(r => r.customer)).size;
  const currNew = currRevs.filter(r => r.isNewCustomer).length;

  const trendVsLast = getTrend(currTotal, prevTotal);
  const trendVsYear = getTrend(currTotal, yearAgoTotal);

  const lineMap = {};
  currRevs.forEach(r => { lineMap[r.businessLine] = (lineMap[r.businessLine] || 0) + r.amount; });
  const lines = Object.entries(lineMap)
    .map(([n,a]) => ({name:n, amount:a, percent: currTotal>0?(a/currTotal*100):0,
      color: (data.businessLines.find(b=>b.name===n)||{}).color || '#7a96a8'}))
    .sort((a,b) => b.amount - a.amount);

  const spMap = {};
  currRevs.forEach(r => { spMap[r.salespersonId] = (spMap[r.salespersonId] || 0) + r.amount; });
  const sps = Object.entries(spMap)
    .map(([id,a]) => ({id, name:getSpName(id), amount:a, percent:currTotal>0?(a/currTotal*100):0}))
    .sort((a,b) => b.amount - a.amount);

  let html = '<div class="page-header"><div>' +
    '<div class="page-title">月度经营总览</div>' +
    '<div class="page-desc">' +
    '<input type="month" class="form-input" style="width:140px;display:inline-block;padding:4px 8px;font-size:12px" value="' + month + '" onchange="data.selectedMonth = this.value; saveData(); render()">' +
    ' · 公司全员业绩快照</div>' +
    '</div></div>';

  html += '<div class="stats-grid">' +
    '<div class="stat-card success"><div class="stat-label">本月总收款</div>' +
    '<div class="stat-value amount">¥' + fmt(currTotal) + '</div>' +
    '<div class="stat-trend ' + trendVsLast.class + '">' + trendVsLast.icon + ' ' + trendVsLast.text + ' <span style="color:var(--text-muted)">环比</span></div></div>' +
    '<div class="stat-card"><div class="stat-label">同比去年</div>' +
    '<div class="stat-value ' + trendVsYear.class + '">' + trendVsYear.icon + ' ' + trendVsYear.text + '</div>' +
    '<div class="stat-trend">去年同期 ¥' + fmt(yearAgoTotal) + '</div></div>' +
    '<div class="stat-card"><div class="stat-label">订单数</div>' +
    '<div class="stat-value">' + currRevs.length + '</div>' +
    '<div class="stat-trend">客单 ¥' + fmt(currRevs.length>0 ? currTotal/currRevs.length : 0) + '</div></div>' +
    '<div class="stat-card warning"><div class="stat-label">客户数 / 新客</div>' +
    '<div class="stat-value">' + currCustomers + ' <span style="font-size:14px;color:var(--text-dim)">/ ' + currNew + '</span></div></div>' +
    '</div>';

  html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">';
  html += '<div class="card"><div class="card-title">业务线占比</div>';
  if (lines.length === 0) html += '<div class="empty">本月无收款</div>';
  else lines.forEach(l => {
    html += '<div class="bar-row"><div class="bar-name">' + escapeHtml(l.name) + '</div>' +
      '<div class="bar-track"><div class="bar-fill" style="width:' + l.percent + '%;background:' + l.color + '" data-value="¥' + fmt(l.amount) + '"></div></div>' +
      '<div class="bar-percent">' + l.percent.toFixed(1) + '%</div></div>';
  });

  html += '<div class="card"><div class="card-title">业务员占比</div>';
  if (sps.length === 0) html += '<div class="empty">本月无收款</div>';
  else sps.forEach((s,i) => {
    const rankCls = i===0?'top1':i===1?'top2':i===2?'top3':'';
    html += '<div class="bar-row"><div class="bar-name">' +
      '<span class="rank-badge ' + rankCls + '" style="width:18px;height:18px;font-size:10px;margin-right:6px">' + (i+1) + '</span>' + s.name + '</div>' +

function renderTrend() {
  const months = [];
  const [y, m] = data.selectedMonth.split('-').map(Number);
  for (let i = 5; i >= 0; i--) {
    months.push(new Date(y, m-1-i, 1).toISOString().slice(0,7));
  }
  const monthData = months.map(month => {
    const revs = getMonthRevenues(month);
    return { month, total: revs.reduce((s,r) => s+r.amount, 0), orders: revs.length };
  });
  const maxTotal = Math.max(...monthData.map(m => m.total), 1);

  const spTrend = data.salespeople.filter(s => s.status === 'active').map(sp => ({
    ...sp,
    months: months.map(m => getMonthRevenues(m).filter(r => r.salespersonId === sp.id).reduce((s,r) => s+r.amount, 0))
  }));

  let html = '<div class="page-header"><div>' +
    '<div class="page-title">趋势对比</div>' +
    '<div class="page-desc">最近6个月 · 公司整体 + 业务员个人</div>' +
    '</div></div>';

  html += '<div class="card"><div class="card-title">公司整体收款趋势</div>' +
    '<div style="display:flex;gap:8px;align-items:flex-end;height:200px;padding:20px 0">';
  monthData.forEach((m, i) => {
    const heightPct = maxTotal > 0 ? (m.total / maxTotal * 100) : 0;
    const trend = i > 0 ? getTrend(m.total, monthData[i-1].total) : null;
    html += '<div style="flex:1;display:flex;flex-direction:column;align-items:center">' +
      '<div style="font-size:12px;color:var(--text-dim);margin-bottom:6px;font-weight:500">¥' + fmt(m.total) + '</div>' +
      (trend ? '<div style="font-size:11px" class="' + trend.class + '">' + trend.icon + ' ' + trend.text + '</div>' : '<div style="height:14px"></div>') +
      '<div style="width:80%;background:linear-gradient(180deg,var(--accent),var(--accent-deeper));height:' + heightPct + '%;min-height:4px;border-radius:4px 4px 0 0;margin-top:8px"></div>' +
      '<div style="font-size:11px;color:var(--text-muted);margin-top:8px">' + m.month.slice(5) + '月</div>' +
      '<div style="font-size:10px;color:var(--text-muted)">' + m.orders + '单</div></div>';
  });
  html += '</div></div>';

  html += '<div class="card"><div class="card-title">业务员月度趋势</div>' +
    '<div class="table-wrap" style="border:none"><table><thead><tr>' +
    '<th>业务员</th>';
  months.forEach(m => { html += '<th style="text-align:right">' + m.slice(5) + '月</th>'; });
  html += '<th style="text-align:right">趋势</th></tr></thead><tbody>';

  spTrend.forEach(sp => {
    const last = sp.months[sp.months.length-1];
    const prev = sp.months[sp.months.length-2];
    const trend = getTrend(last, prev);
    const allZero = sp.months.every(v => v === 0);
    html += '<tr><td><strong>' + escapeHtml(sp.name) + '</strong></td>';
    sp.months.forEach((v,i) => {
      const prevV = i > 0 ? sp.months[i-1] : 0;
      const cls = i > 0 && prevV > 0 ? (v > prevV ? 'trend-up' : v < prevV ? 'trend-down' : '') : '';
      html += '<td style="text-align:right" class="' + cls + ' amount">¥' + fmt(v) + '</td>';
    });
    html += '<td style="text-align:right">' +
      (allZero ? '<span class="tag tag-muted">无业绩</span>' :
        '<span class="' + trend.class + '" style="font-weight:500">' + trend.icon + ' ' + trend.text + '</span>') +
      '</td></tr>';
  });
  html += '</tbody></table></div></div>';

  return html;
}

function renderBusinessAnalysis() {

  const prevRevs = getMonthRevenues(prevMonth);

  const lineNames = [...new Set(data.revenues.map(r => r.businessLine))];
  const lineData = lineNames.map(name => {
    const cur = currRevs.filter(r => r.businessLine === name);
    const prv = prevRevs.filter(r => r.businessLine === name);
    const curT = cur.reduce((s,r) => s+r.amount, 0);
    const prvT = prv.reduce((s,r) => s+r.amount, 0);
    const trend = getTrend(curT, prvT);

    const spMap = {};
    cur.forEach(r => { spMap[r.salespersonId] = (spMap[r.salespersonId] || 0) + r.amount; });
    const topSp = Object.entries(spMap).sort((a,b) => b[1]-a[1])[0];

    return {
      name, curr: curT, trend,
      orders: cur.length,
      customers: new Set(cur.map(r => r.customer)).size,
      avg: cur.length > 0 ? Math.floor(curT/cur.length) : 0,
      topSp: topSp ? { name: getSpName(topSp[0]), amount: topSp[1] } : null,
      color: (data.businessLines.find(b => b.name === name) || {}).color || '#7a96a8'
    };

  let html = '<div class="page-header"><div>' +

    '<th style="text-align:right">环比</th>' +
    '<th style="text-align:right">订单</th>' +
    '<th style="text-align:right">客户</th>' +
    '<th style="text-align:right">客单价</th>' +
    '<th>TOP业务员</th>' +

  else lineData.forEach(l => {
    html += '<tr>' +
      '<td><span style="display:inline-block;width:10px;height:10px;background:' + l.color + ';border-radius:2px;margin-right:8px;vertical-align:middle"></span><strong>' + escapeHtml(l.name) + '</strong></td>' +

function renderCustomerAnalysis() {
  const month = data.selectedMonth;
  const prevMonth = getPrevMonth(month);
  const currRevs = getMonthRevenues(month);
  const prevRevs = getMonthRevenues(prevMonth);

  const allCustomers = [...new Set(data.revenues.map(r => r.customer))];

  const customerData = allCustomers.map(name => {
    const cur = currRevs.filter(r => r.customer === name);
    const prv = prevRevs.filter(r => r.customer === name);
    const curT = cur.reduce((s,r) => s+r.amount, 0);
    const prvT = prv.reduce((s,r) => s+r.amount, 0);
    const trend = getTrend(curT, prvT);
    const sps = [...new Set(cur.map(r => getSpName(r.salespersonId)))];
    const lines = [...new Set(cur.map(r => r.businessLine))];
    const totalAll = data.revenues.filter(r => r.customer === name).reduce((s,r) => s+r.amount, 0);
    return {
      name, curr: curT, prev: prvT, trend, totalAll,
      orders: cur.length, sps, lines,
      isLost: prvT > 0 && curT === 0,
      isNew: prvT === 0 && curT > 0
    };
  }).filter(c => c.curr > 0 || c.prev > 0).sort((a,b) => b.curr - a.curr);

  const totalCurr = currRevs.reduce((s,r) => s+r.amount, 0);
  const lost = customerData.filter(c => c.isLost).length;
  const news = customerData.filter(c => c.isNew).length;
  const top20 = Math.ceil(customerData.length * 0.2);
  const top20Rev = customerData.slice(0, top20).reduce((s,c) => s+c.curr, 0);
  const top20Pct = totalCurr > 0 ? (top20Rev/totalCurr*100).toFixed(1) : 0;

  let html = '<div class="page-header"><div>' +
    '<div class="page-title">客户分析</div>' +
    '<div class="page-desc">' + month + ' · 客户结构、流失与新增</div>' +
    '</div></div>';

  html += '<div class="stats-grid">' +
    '<div class="stat-card"><div class="stat-label">活跃客户</div><div class="stat-value">' + customerData.filter(c => c.curr > 0).length + '</div></div>' +
    '<div class="stat-card success"><div class="stat-label">新增</div><div class="stat-value trend-up">' + news + '</div></div>' +
    '<div class="stat-card ' + (lost > 0 ? 'danger' : '') + '"><div class="stat-label">流失</div><div class="stat-value ' + (lost > 0 ? 'trend-down' : '') + '">' + lost + '</div><div class="stat-trend">上月有,本月无</div></div>' +
    '<div class="stat-card warning"><div class="stat-label">2/8法则</div><div class="stat-value">' + top20Pct + '%</div><div class="stat-trend">TOP ' + top20 + '名贡献占比</div></div>' +
    '</div>';

  if (lost > 0) {
    html += '<div class="alert-bar danger"><span style="font-size:18px">⚠</span><div>' +
      '<strong style="color:var(--danger)">客户流失预警 · 需要回访</strong><br>' +
      '<span style="color:var(--text-dim)">' + customerData.filter(c => c.isLost).map(c => c.name).join('、') + '</span>' +
      '</div></div>';
  }

  html += '<div class="card"><div class="card-title">客户TOP榜</div>' +
    '<div class="table-wrap" style="border:none"><table><thead><tr>' +
    '<th style="width:40px">#</th><th>客户</th>' +
    '<th style="text-align:right">本月</th><th style="text-align:right">上月</th>' +
    '<th style="text-align:right">环比</th><th>业务线</th><th>业务员</th>' +
    '<th style="text-align:right">历史累计</th><th>状态</th>' +
    '</tr></thead><tbody>';

  customerData.forEach((c,i) => {
    let st;
    if (c.isLost) st = '<span class="tag tag-danger">流失</span>';
    else if (c.isNew) st = '<span class="tag tag-success">新增</span>';
    else if (c.trend.class === 'trend-up') st = '<span class="tag tag-success">增长</span>';
    else if (c.trend.class === 'trend-down') st = '<span class="tag tag-warning">下滑</span>';
    else st = '<span class="tag tag-info">稳定</span>';

    html += '<tr><td>' + (i+1) + '</td>' +
      '<td><strong>' + escapeHtml(c.name) + '</strong></td>' +
      '<td style="text-align:right" class="amount">¥' + fmt(c.curr) + '</td>' +
      '<td style="text-align:right" class="amount" style="color:var(--text-dim)">¥' + fmt(c.prev) + '</td>' +
      '<td style="text-align:right" class="' + c.trend.class + '">' + c.trend.icon + ' ' + c.trend.text + '</td>' +
      '<td style="font-size:11px">' + c.lines.slice(0,2).join(' · ') + '</td>' +
      '<td style="font-size:12px">' + c.sps.join(', ') + '</td>' +
      '<td style="text-align:right" class="amount">¥' + fmt(c.totalAll) + '</td>' +
      '<td>' + st + '</td></tr>';
  });
  html += '</tbody></table></div></div>';

  return html;
}

function renderRanking() {
  const month = data.selectedMonth;
  const prevMonth = getPrevMonth(month);
  const currRevs = getMonthRevenues(month);
  const prevRevs = getMonthRevenues(prevMonth);

  const ranking = data.salespeople.filter(s => s.status === 'active').map(sp => {
    const my = currRevs.filter(r => r.salespersonId === sp.id);
    const myPrev = prevRevs.filter(r => r.salespersonId === sp.id);
    const total = my.reduce((s,r) => s+r.amount, 0);
    const prevTotal = myPrev.reduce((s,r) => s+r.amount, 0);
    return {
      ...sp, total, prevTotal,
      trend: getTrend(total, prevTotal),
      customers: new Set(my.map(r => r.customer)).size,
      newCustomers: my.filter(r => r.isNewCustomer).length,
      orders: my.length,
      avg: my.length > 0 ? Math.floor(total/my.length) : 0,
      lines: [...new Set(my.map(r => r.businessLine))]

    '<th>主要业务线</th><th>状态</th>' +
    '</tr></thead><tbody>';

  ranking.forEach((s,i) => {
    const isLast = i === ranking.length - 1 && ranking.length > 1;
    const rankCls = i===0?'top1':i===1?'top2':i===2?'top3':isLast?'bottom':'';
    let st;
    if (s.total === 0) st = '<span class="tag tag-danger">本月无业绩</span>';
    else if (i === 0 && s.total > 60000) st = '<span class="tag tag-orange">头狼 🐺</span>';

    else if (s.trend.class === 'trend-up') st = '<span class="tag tag-success">上升</span>';
    else if (s.trend.class === 'trend-down') st = '<span class="tag tag-warning">下滑</span>';
    else st = '<span class="tag tag-info">稳定</span>';

      '<td><strong>' + escapeHtml(s.name) + '</strong></td>' +
      '<td style="text-align:right" class="amount">¥' + fmt(s.total) + '</td>' +
      '<td style="text-align:right" class="' + s.trend.class + '">' + s.trend.icon + ' ' + s.trend.text + '</td>' +
      '<td style="text-align:right">' + s.orders + '</td>' +
      '<td style="text-align:right" class="amount">¥' + fmt(s.avg) + '</td>' +
      '<td style="text-align:right">' + s.customers + '</td>' +
      '<td style="text-align:right">' + (s.newCustomers > 0 ? '<span class="tag tag-success">+' + s.newCustomers + '</span>' : '0') + '</td>' +
      '<td style="font-size:11px">' + s.lines.slice(0,2).join(' · ') + '</td>' +

  });
  html += '</tbody></table></div>';

  return html;
}

function renderCommission() {
  const month = data.selectedMonth;
  const currRevs = getMonthRevenues(month);
  const plan = data.commissionPlan;

  const list = data.salespeople.filter(s => s.status === 'active').map(sp => {
    const my = currRevs.filter(r => r.salespersonId === sp.id);
    const total = my.reduce((s,r) => s+r.amount, 0);
    const newCustomers = my.filter(r => r.isNewCustomer).length;
    const commission = calcCommission(total);
    const tier = getCommissionTier(total);
    const newCB = plan.bonus.newCustomerBonus * newCustomers;
    const att = plan.bonus.attendance;
    return { ...sp, total, commission, tier, newCustomers, newCB, att, totalIncome: sp.baseSalary + commission + newCB + att };

    '<div class="stat-card orange"><div class="stat-label">提成总额</div><div class="stat-value amount" style="color:var(--orange)">¥' + fmt(totalCommission) + '</div><div class="stat-trend">占收款 ' + (totalRevenue>0?(totalCommission/totalRevenue*100).toFixed(1):0) + '%</div></div>' +

    '</div>';

  html += '<div class="table-wrap"><table><thead><tr>' +
    '<th>业务员</th><th style="text-align:right">业绩</th><th style="text-align:right">底薪</th>' +

    '<th style="text-align:right">应发</th>' +

    html += '<tr><td><strong>' + escapeHtml(s.name) + '</strong></td>' +
      '<td style="text-align:right" class="amount">¥' + fmt(s.total) + '</td>' +
      '<td style="text-align:right" class="amount">¥' + fmt(s.baseSalary) + '</td>' +
      '<td><span class="tag ' + tagCls + '">' + (s.tier.label || '无') + '</span> ' +
      (s.total > 0 ? '<span style="color:var(--text-muted);font-size:11px">' + (s.tier.rate*100).toFixed(1) + '%</span>' : '') + '</td>' +
      '<td style="text-align:right" class="amount">¥' + fmt(s.commission) + '</td>' +

function renderIndividual() {
  const sp = data.salespeople.find(s => s.status === 'active') || data.salespeople[0];
  if (!sp) return '<div class="empty">暂无业务员</div>';

  const month = data.selectedMonth;
  const monthRevs = getMonthRevenues(month).filter(r => r.salespersonId === sp.id);
  const monthTotal = monthRevs.reduce((s,r) => s+r.amount, 0);
  const allTotal = data.revenues.filter(r => r.salespersonId === sp.id).reduce((s,r) => s+r.amount, 0);

  // 6个月趋势
  const months = [];
  const [y, m] = month.split('-').map(Number);
  for (let i = 5; i >= 0; i--) months.push(new Date(y, m-1-i, 1).toISOString().slice(0,7));
  const trend = months.map(mm => {
    const revs = data.revenues.filter(r => r.salespersonId === sp.id && r.date.startsWith(mm));
    return { month: mm, total: revs.reduce((s,r) => s+r.amount, 0) };
  });
  const maxT = Math.max(...trend.map(t => t.total), 1);

  // 客户、业务线
  const cMap = {};
  monthRevs.forEach(r => {
    if (!cMap[r.customer]) cMap[r.customer] = { name: r.customer, amount: 0, lines: new Set() };
    cMap[r.customer].amount += r.amount;
    cMap[r.customer].lines.add(r.businessLine);
  });
  const customers = Object.values(cMap).sort((a,b) => b.amount - a.amount);

  const lMap = {};
  monthRevs.forEach(r => { lMap[r.businessLine] = (lMap[r.businessLine] || 0) + r.amount; });
  const lines = Object.entries(lMap).map(([n,a]) => ({name:n,amount:a})).sort((a,b)=>b.amount-a.amount);

  let html = '<div class="page-header"><div>' +
    '<div class="page-title">个人画像</div>' +
    '<div class="page-desc">深度查看单个业务员</div>' +
    '</div><select class="form-select" id="spSel" onchange="renderMain()" style="width:180px">';
  data.salespeople.filter(s => s.status === 'active').forEach(s => {
    html += '<option value="' + s.id + '" ' + (s.id === sp.id ? 'selected' : '') + '>' + escapeHtml(s.name) + '</option>';
  });
  html += '</select></div>';

  html += '<div class="card"><div style="display:flex;justify-content:space-between;align-items:center">' +
    '<div><div style="font-size:22px;font-weight:600">' + escapeHtml(sp.name) + '</div>' +
    '<div style="color:var(--text-dim);font-size:13px;margin-top:4px">入职 ' + sp.joinDate + ' · 底薪 ¥' + fmt(sp.baseSalary) + '</div></div>' +
    '<div style="text-align:right"><div style="font-size:11px;color:var(--text-muted)">历史累计</div>' +
    '<div style="font-size:24px;font-weight:600" class="amount">¥' + fmt(allTotal) + '</div></div>' +
    '</div></div>';

  html += '<div class="card"><div class="card-title">最近6个月趋势</div>' +
    '<div style="display:flex;gap:8px;align-items:flex-end;height:160px">';
  trend.forEach(t => {
    const h = maxT > 0 ? (t.total/maxT*100) : 0;
    html += '<div style="flex:1;display:flex;flex-direction:column;align-items:center">' +
      '<div style="font-size:11px;color:var(--text-dim);margin-bottom:6px">¥' + fmt(t.total) + '</div>' +
      '<div style="width:70%;background:linear-gradient(180deg,var(--accent),var(--accent-deeper));height:' + h + '%;min-height:4px;border-radius:4px 4px 0 0"></div>' +
      '<div style="font-size:11px;color:var(--text-muted);margin-top:8px">' + t.month.slice(5) + '月</div></div>';
  });
  html += '</div></div>';

  html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">';
  html += '<div class="card"><div class="card-title">' + month + ' 客户TOP榜</div>';
  if (customers.length === 0) html += '<div class="empty">本月无客户</div>';
  else customers.slice(0,8).forEach(c => {
    html += '<div style="padding:10px 0;border-bottom:1px solid var(--border)">' +
      '<div class="flex-between"><div><strong>' + escapeHtml(c.name) + '</strong>' +
      '<span style="color:var(--text-muted);font-size:11px;margin-left:8px">' + [...c.lines].join(', ') + '</span></div>' +
      '<span class="amount">¥' + fmt(c.amount) + '</span></div></div>';
  });
  html += '</div>';

  html += '<div class="card"><div class="card-title">' + month + ' 业务线分布</div>';
  if (lines.length === 0) html += '<div class="empty">本月无业绩</div>';
  else lines.forEach(l => {
    const pct = monthTotal > 0 ? (l.amount/monthTotal*100) : 0;
    const color = (data.businessLines.find(b => b.name === l.name) || {}).color || '#7a96a8';
    html += '<div class="bar-row"><div class="bar-name" style="width:80px">' + escapeHtml(l.name) + '</div>' +
      '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%;background:' + color + '" data-value="¥' + fmt(l.amount) + '"></div></div>' +
      '<div class="bar-percent">' + pct.toFixed(1) + '%</div></div>';
  });
  html += '</div></div>';

  return html;
}

      '<span>档位</span><span style="text-align:right">起始</span><span style="text-align:right">结束</span><span style="text-align:right">比例(%)</span></div>';

        '<input class="form-input" style="padding:5px 8px;font-size:12px;text-align:right" type="number" value="' + t.from + '" onchange="updateTier(' + i + ', \'from\', this.value)">' +
        '<input class="form-input" style="padding:5px 8px;font-size:12px;text-align:right" type="number" value="' + (t.to >= 999999999 ? '' : t.to) + '" placeholder="不限" onchange="updateTier(' + i + ', \'to\', this.value)">' +
        '<input class="form-input" style="padding:5px 8px;font-size:12px;text-align:right" type="number" step="0.1" value="' + (t.rate*100).toFixed(1) + '" onchange="updateTier(' + i + ', \'rate\', this.value)">' +
        '</div>';
    });
    html += '</div>';
  } else {
    html += '<div class="card"><div class="card-title">固定比例</div>' +
      '<input class="form-input" type="number" step="0.1" value="' + (plan.fixedRate*100).toFixed(1) + '" onchange="data.commissionPlan.fixedRate = parseFloat(this.value)/100; saveData()" style="max-width:200px"></div>';
  }

  html += '<div class="card"><div class="card-title">额外奖金</div>' +
    '<div class="form-row">' +
    '<div class="form-group"><label class="form-label">全勤奖(月)</label><input class="form-input" type="number" value="' + plan.bonus.attendance + '" onchange="data.commissionPlan.bonus.attendance = parseFloat(this.value)||0; saveData()"></div>' +
    '<div class="form-group"><label class="form-label">每个新客户奖金</label><input class="form-input" type="number" value="' + plan.bonus.newCustomerBonus + '" onchange="data.commissionPlan.bonus.newCustomerBonus = parseFloat(this.value)||0; saveData()"></div>' +

    '④ 新客户奖金激励开拓增量 ' +
    '⑤ 底薪不要轻易涨(降不下来),涨提成才是聪明的</div>';

  return html;
}

function updateTier(i, field, value) {
  if (field === 'rate') data.commissionPlan.tiers[i][field] = parseFloat(value)/100;
  else if (field === 'from' || field === 'to') {
    data.commissionPlan.tiers[i][field] = value === '' ? 999999999 : parseFloat(value);
  } else {
    data.commissionPlan.tiers[i][field] = value;
  }
  saveData();
}

function addTier() {
  const last = data.commissionPlan.tiers[data.commissionPlan.tiers.length-1];
  data.commissionPlan.tiers.push({
    from: last.to >= 999999999 ? 200000 : last.to,
    to: 999999999,
    rate: 0.12,
    label: '新档位'
  });
  saveData();
  render();
}

// ============== FB订单分析 ==============
function renderFbOrders() {
  const month = data.selectedMonth;
  const allOrders = data.fbOrders || [];
  const monthOrders = allOrders.filter(o => o.date && o.date.startsWith(month));

  if (allOrders.length === 0) {
    return '<div class="page-header"><div>' +
      '<div class="page-title">📦 FB订单分析</div>' +
      '<div class="page-desc">暂无FB订单数据</div></div></div>' +
      '<div class="empty"><div class="empty-icon">📦</div><div>请先在收款流水或业务员管理中导入数据</div></div>';
  }

  // 核心指标
  const total = monthOrders.length;
  const paid = monthOrders.filter(o => o.amount > 0);
  const free = monthOrders.filter(o => o.amount === 0);
  const totalAmount = paid.reduce((s,o) => s+o.amount, 0);
  const passed = monthOrders.filter(o => o.passed).length;
  const passRate = total > 0 ? (passed / total * 100).toFixed(1) : 0;
  const ratedOrders = monthOrders.filter(o => o.rating > 0);
  const avgRating = ratedOrders.length > 0 ? (ratedOrders.reduce((s,o) => s+o.rating, 0) / ratedOrders.length).toFixed(2) : 0;
  const avgReviews = ratedOrders.length > 0 ? Math.round(ratedOrders.reduce((s,o) => s+o.reviews, 0) / ratedOrders.length) : 0;
  const aftersaleCount = monthOrders.filter(o => o.aftersale).length;

  let html = '<div class="page-header"><div>' +
    '<div class="page-title">📦 FB订单分析</div>' +
    '<div class="page-desc">' +
    '<input type="month" class="form-input" style="width:140px;display:inline-block;padding:4px 8px;font-size:12px" value="' + month + '" onchange="data.selectedMonth = this.value; saveData(); render()">' +
    ' · FB套餐订单的细节透视</div>' +
    '</div></div>';

  // 统计卡
  html += '<div class="stats-grid">' +
    '<div class="stat-card"><div class="stat-label">总订单</div><div class="stat-value">' + total + '</div><div class="stat-trend">付费 ' + paid.length + ' · 加推 ' + free.length + '</div></div>' +
    '<div class="stat-card success"><div class="stat-label">总收入</div><div class="stat-value amount">¥' + fmt(totalAmount) + '</div><div class="stat-trend">客单 ¥' + fmt(paid.length>0 ? totalAmount/paid.length : 0) + '</div></div>' +
    '<div class="stat-card ' + (parseFloat(passRate) >= 95 ? 'success' : 'warning') + '"><div class="stat-label">检测通过率</div><div class="stat-value">' + passRate + '%</div><div class="stat-trend">' + passed + ' / ' + total + '</div></div>' +
    '<div class="stat-card orange"><div class="stat-label">平均评分</div><div class="stat-value">' + avgRating + ' <span style="font-size:14px;color:var(--text-muted)">/ 5</span></div><div class="stat-trend">均评论数 ' + avgReviews + '</div></div>' +
    '</div>';

  // 员工排名
  const staffMap = {};
  monthOrders.forEach(o => {
    if (!staffMap[o.staffName]) {
      staffMap[o.staffName] = { name: o.staffName, total: 0, paid: 0, free: 0, amount: 0, passCount: 0, ratingSum: 0, ratingN: 0, reviewSum: 0, reviewN: 0, aftersale: 0 };
    }
    const s = staffMap[o.staffName];
    s.total++;
    if (o.amount > 0) { s.paid++; s.amount += o.amount; } else { s.free++; }
    if (o.passed) s.passCount++;
    if (o.rating > 0) { s.ratingSum += o.rating; s.ratingN++; }
    if (o.reviews > 0) { s.reviewSum += o.reviews; s.reviewN++; }
    if (o.aftersale) s.aftersale++;
  });
  const staffList = Object.values(staffMap).sort((a,b) => b.amount - a.amount);

  html += '<div class="card"><div class="card-title flex-between"><span>员工FB订单排名</span><span style="font-size:11px;color:var(--text-muted);text-transform:none;letter-spacing:0">点击姓名查看个人画像</span></div>';
  html += '<div class="table-wrap" style="border:none"><table><thead><tr>' +
    '<th style="width:50px">排名</th><th>员工</th>' +
    '<th style="text-align:right">总单</th>' +
    '<th style="text-align:right">付费</th>' +
    '<th style="text-align:right">加推</th>' +
    '<th style="text-align:right">收入</th>' +
    '<th style="text-align:right">客单</th>' +
    '<th style="text-align:right">通过率</th>' +
    '<th style="text-align:right">均分</th>' +
    '<th style="text-align:right">均评论</th>' +
    '<th style="text-align:right">售后</th>' +
    '</tr></thead><tbody>';
  staffList.forEach((s, i) => {
    const rankCls = i===0?'top1':i===1?'top2':i===2?'top3':(i === staffList.length-1 && staffList.length > 1 ? 'bottom' : '');
    const passRateS = s.total > 0 ? (s.passCount/s.total*100).toFixed(1) : 0;
    const passRateColor = parseFloat(passRateS) >= 95 ? 'var(--success)' : parseFloat(passRateS) >= 90 ? 'var(--warning)' : 'var(--danger)';
    const avgR = s.ratingN > 0 ? (s.ratingSum/s.ratingN).toFixed(2) : '-';
    const avgRev = s.reviewN > 0 ? Math.round(s.reviewSum/s.reviewN) : '-';
    const avgPrice = s.paid > 0 ? Math.round(s.amount/s.paid) : 0;
    html += '<tr><td><span class="rank-badge ' + rankCls + '">' + (i+1) + '</span></td>' +
      '<td><strong>' + escapeHtml(s.name) + '</strong></td>' +
      '<td style="text-align:right">' + s.total + '</td>' +
      '<td style="text-align:right">' + s.paid + '</td>' +
      '<td style="text-align:right">' + (s.free > 0 ? '<span style="color:var(--accent-dark)">' + s.free + '</span>' : '0') + '</td>' +
      '<td style="text-align:right" class="amount">¥' + fmt(s.amount) + '</td>' +
      '<td style="text-align:right" class="amount">¥' + fmt(avgPrice) + '</td>' +
      '<td style="text-align:right;color:' + passRateColor + '">' + passRateS + '%</td>' +
      '<td style="text-align:right">' + avgR + '</td>' +
      '<td style="text-align:right">' + avgRev + '</td>' +
      '<td style="text-align:right">' + (s.aftersale > 0 ? '<span class="tag tag-warning">' + s.aftersale + '</span>' : '-') + '</td>' +
      '</tr>';
  });
  html += '</tbody></table></div></div>';

  // 折扣率分布
  const discountMap = {};
  monthOrders.forEach(o => {
    if (!o.discount) return;
    const d = o.discount;
    if (!discountMap[d]) discountMap[d] = { discount: d, count: 0, amount: 0 };
    discountMap[d].count++;
    discountMap[d].amount += o.amount;
  });
  const discountList = Object.values(discountMap).sort((a,b) => parseInt(a.discount) - parseInt(b.discount));

  // 产品TOP
  const productMap = {};
  monthOrders.forEach(o => {
    if (!o.product) return;
    if (!productMap[o.product]) productMap[o.product] = { name: o.product, count: 0, amount: 0 };
    productMap[o.product].count++;
    productMap[o.product].amount += o.amount;
  });
  const topProducts = Object.values(productMap).sort((a,b) => b.amount - a.amount).slice(0, 10);

  html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">';

  // 折扣率分布
  html += '<div class="card"><div class="card-title">折扣率分布</div>';
  if (discountList.length === 0) {
    html += '<div class="empty">无数据</div>';
  } else {
    const maxCount = Math.max(...discountList.map(d => d.count));
    discountList.forEach(d => {
      const pct = (d.count / maxCount * 100).toFixed(0);
      html += '<div class="bar-row"><div class="bar-name" style="width:60px">' + escapeHtml(d.discount) + '</div>' +
        '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%;background:var(--accent)" data-value="' + d.count + '单 · ¥' + fmt(d.amount) + '"></div></div>' +
        '<div class="bar-percent">' + d.count + '</div></div>';
    });
  }
  html += '</div>';

  // 产品TOP
  html += '<div class="card"><div class="card-title">产品TOP10(按收入)</div>';
  if (topProducts.length === 0) {
    html += '<div class="empty">无数据</div>';
  } else {
    const maxAmt = Math.max(...topProducts.map(p => p.amount));
    topProducts.forEach((p, i) => {
      const pct = maxAmt > 0 ? (p.amount / maxAmt * 100).toFixed(0) : 0;
      html += '<div class="bar-row"><div class="bar-name" style="width:130px;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="' + escapeAttr(p.name) + '">' + (i+1) + '. ' + escapeHtml(p.name) + '</div>' +
        '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%;background:var(--orange)" data-value="¥' + fmt(p.amount) + '"></div></div>' +
        '<div class="bar-percent">' + p.count + '单</div></div>';
    });
  }
  html += '</div></div>';

  // 详细订单列表
  html += '<div class="card"><div class="card-title flex-between"><span>订单明细 (' + monthOrders.length + '条)</span><input class="form-input" style="width:200px;padding:5px 10px;font-size:12px" placeholder="🔍 搜索产品/员工" oninput="filterFbTable(this.value)"></div>';
  html += '<div class="table-wrap" style="border:none;max-height:480px;overflow-y:auto"><table id="fbOrdersTable"><thead style="position:sticky;top:0;background:var(--bg-elevated);z-index:1"><tr>' +
    '<th>日期</th><th>员工</th><th>产品</th>' +
    '<th>折扣码</th><th>折扣</th>' +
    '<th style="text-align:right">金额</th>' +
    '<th>检测</th><th>评分</th><th>评论数</th>' +
    '</tr></thead><tbody>';

  // 倒序展示(最新的在前面)
  [...monthOrders].reverse().forEach(o => {
    html += '<tr class="fb-row" data-search="' + escapeAttr((o.product + ' ' + o.staffName).toLowerCase()) + '">' +
      '<td class="text-mono" style="font-size:11px">' + o.date + '</td>' +
      '<td><strong>' + escapeHtml(o.staffName) + '</strong></td>' +
      '<td>' + escapeHtml(o.product || '-') + '</td>' +
      '<td class="text-mono" style="font-size:11px;color:var(--text-muted)">' + escapeHtml(o.discountCode || '-') + '</td>' +
      '<td>' + escapeHtml(o.discount || '-') + '</td>' +
      '<td style="text-align:right" class="amount">' + (o.amount > 0 ? '¥' + fmt(o.amount) : '<span class="tag tag-info">加推</span>') + '</td>' +
      '<td>' + (o.passed ? '<span class="tag tag-success">通过</span>' : '<span class="tag tag-danger">未通过</span>') + '</td>' +
      '<td>' + (o.rating > 0 ? o.rating.toFixed(1) : '-') + '</td>' +
      '<td>' + (o.reviews > 0 ? o.reviews.toLocaleString() : '-') + '</td>' +
      '</tr>';
  });

  html += '</tbody></table></div></div>';

  return html;
}

function filterFbTable(q) {
  const s = (q || '').toLowerCase();
  document.querySelectorAll('#fbOrdersTable tbody tr.fb-row').forEach(tr => {
    const txt = tr.dataset.search || '';
    tr.style.display = (!s || txt.includes(s)) ? '' : 'none';
  });
}


// ============== 财务管控模块 ==============

function isWhitelisted(email) {
  if (!email) return false;
  return data.whitelist.some(w => w.email && w.email.toLowerCase() === email.toLowerCase() && w.status === 'active');
}

function getFinanceAlerts() {
  const alerts = [];
  data.payments.forEach(p => {
    if (!isWhitelisted(p.ppEmail)) {
      alerts.push({
        level: 'danger', type: '白名单外打款',
        message: getStaffName(p.staffId) + ' 给非白名单账号 ' + p.ppEmail + ' 打款 $' + p.amount,
        date: p.date, action: '立即核查,可能存在偷钱风险'
      });
    }
    if (!p.screenshot) {
      alerts.push({
        level: 'warning', type: '缺少截图',
        message: getStaffName(p.staffId) + ' 的打款 ' + p.id + ' 没有上传截图',
        date: p.date, action: '要求员工补传'
      });
    }
  });
  return alerts;
}

function verifyPayment(id) {
  const p = data.payments.find(x => x.id === id);

function markAbnormal(id) {
  const note = prompt('请说明异常原因:');
  if (!note) return;
  const p = data.payments.find(x => x.id === id);
  if (p) { p.status = 'abnormal'; p.note = note; saveData(); render(); }
}

function saveWl() {
  const email = document.getElementById('wl_email').value.trim().toLowerCase();
  const contactName = document.getElementById('wl_contact').value.trim();
  const platform = document.getElementById('wl_platform').value;
  const priceVal = document.getElementById('wl_price').value;
  const price = priceVal ? parseFloat(priceVal) : null;

  // 收集群
  const groupRows = document.querySelectorAll('#wl_groups .wl-group-row');
  const groups = [];
  groupRows.forEach((row, i) => {
    const name = row.querySelector('[data-field="name"]').value.trim();
    const link = row.querySelector('[data-field="link"]').value.trim();
    if (name || link) {
      groups.push({ name: name || '(待补充)', link: link, isMain: i === 0 });
    }
  });

  if (groups.length === 0) return alert('至少填写一个群');
  if (email && data.whitelist.some(w => w.email && w.email.toLowerCase() === email)) {
    return alert('该PP邮箱已在白名单中');
  }

  data.whitelist.push({
    id: uid('w'),
    email,
    contactName,
    platform,
    price,
    groups,
    addedDate: today(),
    status: email ? 'active' : 'pending'
  });
  saveData();
  closeModal();
  render();
}

    const name = row.querySelector('[data-field="name"]').value.trim();

      groups.push({ name: name || '(待补充)', link, isMain: i === 0 });
    }
  });

  if (groups.length === 0) return alert('至少保留一个群');

  w.email = email;

  w.platform = platform;
  w.price = price;
  w.groups = groups;

  saveData();
  closeModal();
  render();
}

// 解析文本,返回红人列表(自动合并相同邮箱、识别附属群)
function parseImportText(text) {
  if (!text || !text.trim()) return [];
  const lines = text.split(/\r?\n/).filter(l => l.trim());

  const firstLine = lines[0];
  const sep = firstLine.includes('\t') ? '\t' : ',';

  let skipFirst = false;
  const firstCells = firstLine.split(sep).map(c => c.trim());
  if (firstCells.some(c => /群名|群链接|链接|付费|价格|邮箱|email|name|link|price/i.test(c))) {
    skipFirst = true;
  }

  // 第一阶段:逐行解析
  const rawRows = [];
  for (let i = skipFirst ? 1 : 0; i < lines.length; i++) {
    const cells = lines[i].split(sep).map(c => c.trim());
    if (cells.length < 2) continue;
    const name = cells[0] || '';
    const link = cells[1] || '';
    const priceStr = cells[2] || '';
    const email = (cells[3] || '').toLowerCase();
    if (!name && !link) continue;

    let price = null;
    if (priceStr) {
      const m = priceStr.match(/(\d+(?:\.\d+)?)/);
      if (m) price = parseFloat(m[1]);
    }

    let platform = 'FB';
    if (link.toLowerCase().includes('instagram')) platform = 'INS';
    else if (link.toLowerCase().includes('tiktok') || link.toLowerCase().includes('t.me/')) platform = 'TG';

    const validEmail = email && /^[\w\.-]+@[\w\.-]+\.\w+$/.test(email);

    rawRows.push({
      name: name || '(待补充群名)',
      link, price, email: validEmail ? email : '',
      platform, hasEmail: validEmail
    });
  }

  // 第二阶段:聚合成红人(同邮箱合并 + 无邮箱归到上一个红人)
  const redPersons = [];
  let current = null;

  rawRows.forEach(r => {
    if (r.email) {
      // 检查是否已有同邮箱的红人
      const existing = redPersons.find(rp => rp.email === r.email);
      if (existing) {
        existing.groups.push({ name: r.name, link: r.link, isMain: false });
        current = existing;
      } else {
        const newRp = {
          email: r.email,
          contactName: '',
          platform: r.platform,
          price: r.price,
          groups: [{ name: r.name, link: r.link, isMain: true }],
          hasEmail: true
        };
        redPersons.push(newRp);
        current = newRp;
      }
    } else {
      // 无邮箱:归到上一个红人作为附属群
      if (current) {
        current.groups.push({ name: r.name, link: r.link, isMain: false });
      } else {
        // 文件开头无邮箱
        const newRp = {
          email: '',
          contactName: '',
          platform: r.platform,
          price: r.price,
          groups: [{ name: r.name, link: r.link, isMain: true }],
          hasEmail: false
        };
        redPersons.push(newRp);
        current = newRp;
      }
    }
  });

  return redPersons;
}

function previewImport() {
  const text = document.getElementById('imp_text').value;
  const redPersons = parseImportText(text);
  const preview = document.getElementById('imp_preview');

  if (redPersons.length === 0) {
    preview.innerHTML = '<div style="color:var(--danger);font-size:13px">⚠ 未解析到任何数据</div>';
    return;
  }

  // 检查重复
  const existingEmails = new Set(data.whitelist.map(w => (w.email || '').toLowerCase()).filter(Boolean));
  let dupCount = 0;
  let totalGroups = 0;
  redPersons.forEach(rp => {
    if (rp.email && existingEmails.has(rp.email)) { rp._dup = true; dupCount++; }
    totalGroups += rp.groups.length;
  });

  const newCount = redPersons.filter(r => r.hasEmail && !r._dup).length;
  const pendingCount = redPersons.filter(r => !r.hasEmail).length;

  let html = '<div style="background:var(--bg-elevated);padding:12px;border-radius:6px;font-size:13px;margin-bottom:10px">' +
    '<strong style="color:var(--accent-deeper)">📊 解析结果:</strong> ' +
    '<strong>' + redPersons.length + '</strong> 个红人,共 <strong>' + totalGroups + '</strong> 个群<br>' +
    '<span style="color:var(--success)">' + newCount + ' 新红人</span> · ' +
    '<span style="color:var(--warning)">' + pendingCount + ' 待补全(无邮箱)</span>' +
    (dupCount > 0 ? ' · <span style="color:var(--danger)">' + dupCount + ' 重复(已存在,会跳过)</span>' : '') +
    '</div>';

  html += '<div style="max-height:280px;overflow-y:auto;border:1px solid var(--border);border-radius:6px;padding:8px;font-size:12px">';
  redPersons.slice(0, 20).forEach((rp, i) => {
    let stTag;
    if (rp._dup) stTag = '<span class="tag tag-danger">重复</span>';
    else if (rp.hasEmail) stTag = '<span class="tag tag-success">新增</span>';
    else stTag = '<span class="tag tag-warning">待补全</span>';

    html += '<div style="padding:8px;border-bottom:1px solid var(--border);' + (i === redPersons.length-1 ? 'border-bottom:none' : '') + '">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">' +
      '<div><strong class="text-mono">' + escapeHtml(rp.email || '(待补)') + '</strong> ' +
      '<span style="color:var(--text-muted)">$' + (rp.price || '?') + ' · ' + rp.platform + '</span></div>' +
      stTag + '</div>';
    rp.groups.forEach((g, gi) => {
      html += '<div style="font-size:11px;color:var(--text-dim);padding-left:12px">' +
        (gi === 0 ? '★' : '└') + ' ' + escapeHtml(g.name.substring(0, 60)) + '</div>';
    });
    html += '</div>';
  });
  if (redPersons.length > 20) {
    html += '<div style="padding:6px 8px;text-align:center;color:var(--text-muted)">... 还有 ' + (redPersons.length - 20) + ' 个红人</div>';
  }
  html += '</div>';

  preview.innerHTML = html;
  window._pendingImport = redPersons;
}

function confirmImport() {
  if (!window._pendingImport) {
    previewImport();
    if (!window._pendingImport || window._pendingImport.length === 0) return;
  }
  const redPersons = window._pendingImport;
  const toImport = redPersons.filter(r => !r._dup);
  if (toImport.length === 0) return alert('没有可导入的数据');

  const today2 = today();
  toImport.forEach(rp => {
    data.whitelist.push({
      id: uid('w'),
      email: rp.email,
      contactName: rp.contactName || '',
      platform: rp.platform,
      price: rp.price,
      groups: rp.groups,
      addedDate: today2,
      status: rp.email ? 'active' : 'pending'
    });
  });

  saveData();
  window._pendingImport = null;
  closeModal();
  alert('✓ 成功导入 ' + toImport.length + ' 个红人,共 ' + toImport.reduce((s,r)=>s+r.groups.length,0) + ' 个群');
  render();
}

  }

// 群选择改变 → 显示自动填充的信息
function onGroupChange() {
  const rpId = document.getElementById('pay_redperson').value;
  const rp = data.whitelist.find(w => w.id === rpId);
  if (!rp) return;
  const gIdx = parseInt(document.getElementById('pay_group_id').value || 0);
  const g = (rp.groups || [])[gIdx];

    '<div style="grid-column:1/-1"><div style="font-size:11px;color:var(--text-muted);margin-bottom:3px">本次发帖目标群</div>' +
    '<div style="font-weight:600;margin-bottom:4px">' + escapeHtml(g.name || '-') + '</div>' +

    '</div></div>' +
    '<div style="margin-top:10px;font-size:11px;color:var(--text-muted)">💡 上方信息已锁定,如需修改请到"白名单管理"调整该红人的资料</div>';

  // 自动把金额填充为参考价(如果用户还没填)
  const amtInput = document.getElementById('pay_amount');
  if (amtInput && !amtInput.value && rp.price) {
    amtInput.value = rp.price;
    amtInput.style.background = '#fffaf3';
    setTimeout(() => { amtInput.style.background = ''; }, 1500);
  }
}

function submitPayment() {
  const date = document.getElementById('pay_date').value;
  const time = document.getElementById('pay_time').value;
  const staffId = document.getElementById('pay_staff').value;
  const amount = parseFloat(document.getElementById('pay_amount').value);
  const orderId = document.getElementById('pay_order').value.trim();
  const file = document.getElementById('pay_screenshot').files[0];
  const rpId = document.getElementById('pay_redperson').value;

  if (!date || !time || !staffId || !amount) {
    return alert('带 * 的字段必填');
  }

  if (!rpId) {
    return alert('请选择红人');
  }

  let email = '', groupLink = '', groupName = '', isCustom = false;

  if (rpId === '__custom__') {
    isCustom = true;
    email = (document.getElementById('pay_email_custom').value || '').trim().toLowerCase();
    groupLink = (document.getElementById('pay_link_custom').value || '').trim();
    if (!email || !groupLink) return alert('自定义模式下,PP邮箱和群链接必填');
  } else {
    const rp = data.whitelist.find(w => w.id === rpId);
    if (!rp) return alert('找不到该红人');
    email = rp.email;
    const gIdx = parseInt(document.getElementById('pay_group_id').value || 0);
    const g = (rp.groups || [])[gIdx];
    if (!g) return alert('请选择群');
    groupLink = g.link || '';
    groupName = g.name || '';
  }

  if (!email) return alert('该红人没有PP邮箱,无法打款');

  if (isCustom && !isWhitelisted(email)) {
    if (!confirm('⚠ 该PP账号不在白名单!\n\n苏总警告:"别打给不认识的账号" — 这是最常见的偷钱方式。\n\n如果你已经在群里@老板报备并得到批准,点确定继续。')) {
      return;
    }
  }

  data.payments.push({
    id: uid('p'), date, time, staffId,
    ppEmail: email, amount,
    orderId, groupLink, groupName,
    redPersonId: isCustom ? null : rpId,
    screenshot: file ? 'has' : '',
    status: 'pending', note: ''
  });

  saveData();
  alert('✓ 打款记录已提交,等待财务对账');
  navigate('payments');
}

function renderQuoteCategory() {
  const catId = data.quoteCategoryPage;
  const items = PRICE_DATA[catId] || [];
  const cat = QUOTE_CATEGORIES.find(c => c.id === catId);
  if (!cat) return '<div class="empty">未知分类</div>';

  const subCats = [...new Set(items.map(i => i.category).filter(Boolean))];

  let filtered = items.map((item, idx) => Object.assign({}, item, {_idx: idx}));
  if (data.quoteSearch) {
    const s = data.quoteSearch.toLowerCase();
    filtered = filtered.filter(i =>
      (i.name || '').toLowerCase().includes(s) ||
      (i.desc || '').toLowerCase().includes(s) ||
      (i.category || '').toLowerCase().includes(s)
    );
  }
  if (data.quoteFilter) filtered = filtered.filter(i => i.category === data.quoteFilter);

  const prices = items.map(i => parsePrice(i.price)).filter(p => p > 0);
  const minP = prices.length ? Math.min(...prices) : 0;
  const maxP = prices.length ? Math.max(...prices) : 0;

  let html = '<div class="page-header"><div>' +
    '<div class="page-title">' + cat.icon + ' ' + cat.label + '</div>' +
    '<div class="page-desc">共 ' + items.length + ' 个渠道 · 价格区间 ¥' + fmt(minP) + ' ~ ¥' + fmt(maxP) + '</div>' +
    '</div></div>';

  html += '<div class="search-bar"><span style="color:var(--accent)">🔍</span>' +
    '<input class="search-input" placeholder="搜索渠道名、描述、关键词..." value="' + escapeHtml(data.quoteSearch) + '" oninput="updateQuoteSearch(this.value)">';
  if (data.quoteSearch) html += '<button class="btn btn-secondary btn-sm" onclick="updateQuoteSearch(\'\')">清除</button>';
  html += '</div>';

  if (subCats.length > 1) {
    html += '<div class="filter-tags">';
    html += '<span class="filter-tag ' + (!data.quoteFilter ? 'active' : '') + '" onclick="setQuoteFilter(\'\')">全部</span>';
    subCats.forEach(s => {
      html += '<span class="filter-tag ' + (data.quoteFilter === s ? 'active' : '') + '" onclick="setQuoteFilter(\'' + escapeAttr(s) + '\')">' + escapeHtml(s) + '</span>';
    });
    html += '</div>';
  }

  if (filtered.length === 0) {
    html += '<div class="empty"><div class="empty-icon">🔍</div><div>没有匹配的渠道</div></div>';
  } else {
    html += '<div class="items-grid">';
    filtered.forEach(item => { html += renderItemCard(catId, item); });
    html += '</div>';
  }
  return html;
}

function renderItemCard(catId, item) {
  const key = quoteItemKey(catId, item._idx);
  const inCart = data.cart.some(c => c.key === key);
  const cur = item.currency || 'CNY';
  const cnyPrice = parsePrice(item.price);
  const priceDisplay = formatPriceDisplay(item);
  const linkUrl = item.url || item.sample_url || '';
  const hasLink = linkUrl && linkUrl !== 'nan';

  let html = '<div class="item-card ' + (inCart ? 'in-cart' : '') + '">';
  if (item.category) html += '<div class="item-cat">' + escapeHtml(item.category) + '</div>';

  if (hasLink) {
    html += '<a href="' + escapeAttr(linkUrl) + '" target="_blank" rel="noopener" style="text-decoration:none;color:inherit">' +
      '<div class="item-name clickable">' + escapeHtml(item.name) + '<span class="ext-icon">↗</span></div></a>';
  } else {
    html += '<div class="item-name">' + escapeHtml(item.name) + '</div>';
  }

  html += '<div class="item-meta">';
  if (item.platform) html += '<span>📦 ' + escapeHtml(item.platform) + '</span>';
  if (item.form) html += '<span>' + escapeHtml(item.form) + '</span>';
  if (item.time) html += '<span>⏱ ' + escapeHtml(item.time) + '</span>';
  if (item.traffic) html += '<span>📈 ' + escapeHtml(item.traffic) + '</span>';
  html += '</div>';

  if (item.desc) html += '<div class="item-desc">' + escapeHtml(item.desc) + '</div>';

  html += '<div class="item-bottom"><div><div class="item-price">' + priceDisplay + '</div>';
  if (cur === 'USD' || cur === 'EUR') html += '<div style="font-size:11px;color:var(--text-muted)">≈ ¥' + fmt(cnyPrice) + '</div>';
  html += '</div><div style="display:flex;gap:6px">';
  if (item.sample_url && item.sample_url !== item.url && item.sample_url !== 'nan') {
    html += '<a href="' + escapeAttr(item.sample_url) + '" target="_blank" rel="noopener" style="text-decoration:none" title="样例文章"><button class="btn btn-secondary btn-sm">📄</button></a>';
  }
  if (inCart) html += '<button class="btn btn-secondary btn-sm" onclick="removeFromCart(\'' + key + '\')">移除</button>';
  else html += '<button class="btn btn-orange btn-sm" onclick="addToCart(\'' + key + '\')">+ 报价</button>';
  html += '</div></div></div>';
  return html;
}

function updateQuoteSearch(v) { data.quoteSearch = v; saveData(); renderMain(); }
function setQuoteFilter(v) { data.quoteFilter = v; saveData(); renderMain(); }

function addToCart(key) {
  if (data.cart.some(c => c.key === key)) return;
  data.cart.push({ key, qty: 1, customPrice: undefined });
  saveData();
  render();
}

function removeFromCart(key) {
  data.cart = data.cart.filter(c => c.key !== key);
  saveData();
  render();
}

function renderQuoteCart() {
  if (data.cart.length === 0) {
    return '<div class="page-header"><div>' +
      '<div class="page-title">🛒 报价清单</div>' +
      '<div class="page-desc">还没添加项目</div></div></div>' +
      '<div class="empty"><div class="empty-icon">🛒</div><div>清单为空,去左侧选择渠道吧</div></div>';
  }

  let costTotal = 0, quoteTotal = 0, rowsHtml = '';

  data.cart.forEach(c => {
    const item = getQuoteItem(c.key);
    if (!item) return;
    const cost = parsePrice(item.price);
    const price = c.customPrice !== undefined ? c.customPrice : cost;
    const qty = c.qty || 1;
    const sub = price * qty;
    costTotal += cost * qty;
    quoteTotal += sub;

    rowsHtml += '<div class="cart-row">' +
      '<div><div style="font-size:11px;color:var(--accent-dark);text-transform:uppercase;letter-spacing:1px;font-weight:600">' + escapeHtml(item.category || '') + '</div>' +
      '<div style="font-weight:600">' + escapeHtml(item.name) + '</div>' +
      '<div style="font-size:11px;color:var(--text-muted)">参考价: ¥' + fmt(cost) + '</div></div>' +
      '<div><input class="qty-input" type="number" min="1" value="' + qty + '" onchange="updateCartQty(\'' + c.key + '\', this.value)"></div>' +
      '<div><input class="qty-input" type="number" min="0" value="' + Math.round(price) + '" onchange="updateCartPrice(\'' + c.key + '\', this.value)" style="width:90px"></div>' +
      '<div class="amount" style="font-weight:600;text-align:right;color:var(--orange)">¥' + fmt(sub) + '</div>' +
      '<div style="text-align:right"><button class="btn btn-secondary btn-sm" onclick="removeFromCart(\'' + c.key + '\')">删</button></div>' +
      '</div>';
  });

  const profit = quoteTotal - costTotal;
  const profitPct = costTotal > 0 ? (profit/costTotal*100).toFixed(1) : 0;

  let html = '<div class="page-header"><div>' +
    '<div class="page-title">🛒 报价清单</div>' +
    '<div class="page-desc">' + data.cart.length + ' 项</div>' +
    '</div><div style="display:flex;gap:8px">' +
    '<button class="btn btn-secondary" onclick="applyMarkup()">📈 一键调价</button>' +
    '<button class="btn btn-secondary" onclick="clearCart()">清空</button>' +
    '<button class="btn btn-orange" onclick="navigate(\'qquote\')">下一步 →</button>' +
    '</div></div>';

  html += '<div class="stats-grid">' +
    '<div class="stat-card"><div class="stat-label">项目数</div><div class="stat-value">' + data.cart.length + '</div></div>' +
    '<div class="stat-card"><div class="stat-label">参考价合计</div><div class="stat-value amount">¥' + fmt(costTotal) + '</div></div>' +
    '<div class="stat-card orange"><div class="stat-label">客户报价</div><div class="stat-value amount" style="color:var(--orange)">¥' + fmt(quoteTotal) + '</div></div>' +
    '<div class="stat-card ' + (profit >= 0 ? 'success' : 'danger') + '"><div class="stat-label">差价</div><div class="stat-value amount" style="color:' + (profit >= 0 ? 'var(--success)' : 'var(--danger)') + '">¥' + fmt(profit) + '</div><div class="stat-trend">' + (profit >= 0 ? '+' : '') + profitPct + '%</div></div>' +
    '</div>';

  html += '<div style="background:var(--bg-card);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:14px">' +
    '<div class="cart-row header"><div>项目</div><div>数量</div><div>单价(¥)</div><div style="text-align:right">小计</div><div style="text-align:right">操作</div></div>' +
    rowsHtml + '</div>';

  return html;
}

function updateCartQty(key, val) {
  const c = data.cart.find(c => c.key === key);
  if (c) { c.qty = parseInt(val) || 1; saveData(); render(); }
}

function updateCartPrice(key, val) {
  const c = data.cart.find(c => c.key === key);
  if (c) { c.customPrice = parseFloat(val) || 0; saveData(); render(); }
}

function clearCart() {
  if (!confirm('确定清空?')) return;
  data.cart = [];
  saveData();
  render();
}

function applyMarkup() {
  const pct = prompt('调价百分比(20=加20%, -10=打9折):', '15');
  if (pct === null) return;
  const num = parseFloat(pct);
  if (isNaN(num)) return alert('请输入数字');
  data.cart.forEach(c => {
    const item = getQuoteItem(c.key);
    if (item) c.customPrice = Math.round(parsePrice(item.price) * (1 + num/100));
  });
  saveData();
  render();
}

function copyQuoteText() {

  text += '业务员:' + (data.quoteSalesperson || '') + '\n';
  text += '日期:' + new Date().toLocaleDateString('zh-CN') + '\n';
  text += '有效期:' + data.quoteValidDays + '天\n\n──────────────\n';

  let total = 0;
  data.cart.forEach((c, i) => {
    const item = getQuoteItem(c.key);
    if (!item) return;
    const price = c.customPrice !== undefined ? c.customPrice : parsePrice(item.price);
    const qty = c.qty || 1;
    const sub = price * qty;
    total += sub;
    text += (i+1) + '. ' + item.name + '\n   ' + qty + ' × ¥' + fmt(price) + ' = ¥' + fmt(sub) + '\n';
  });

  text += '──────────────\n合计:¥' + fmt(total) + '\n\n感谢选择 Snow123!';

  navigator.clipboard.writeText(text).then(() => alert('报价单已复制!'))
    .catch(() => prompt('请手动复制:', text));
}
