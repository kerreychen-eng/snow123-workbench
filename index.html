// ============== 折扣建议 ==============
function recommendDiscount(form) {
  const orig = parseFloat(form.originalPrice) || 0;
  const disc = parseFloat(form.discountPrice) || 0;
  const goal = form.goal;
  let actualDiscount = orig > 0 ? Math.round((1 - disc/orig) * 100) : 0;

  let suggested = 50;
  if (goal === 'clearance') suggested = 60;
  else if (goal === 'ranking' || goal === 'seckill') suggested = 55;
  else if (goal === 'newproduct') suggested = 50;

  return {
    actual: actualDiscount,
    suggested,
    enough: actualDiscount >= suggested,
    note: orig === 0 ? '(未填原价,无法计算折扣率)' :
          actualDiscount < 40 ? '⚠ 折扣不足40%,大部分FB群不收' :
          actualDiscount < suggested ? `建议至少${suggested}%off,目前${actualDiscount}%偏低` :
          `折扣${actualDiscount}%达标(建议线${suggested}%)`
  };
}

// ============== 价格对比 (Deal站/FB) ==============
function comparePrices(form) {
  const myPrice = parseFloat(form.discountPrice) || 0;
  const dealMin = parseFloat(form.dealsitePriceMin) || 0;
  const dealMax = parseFloat(form.dealsitePriceMax) || 0;
  const fbMin = parseFloat(form.fbPriceMin) || 0;
  const fbMax = parseFloat(form.fbPriceMax) || 0;

  const result = {
    myPrice,
    deal: null,
    fb: null
  };

  if (dealMin > 0 && dealMax > 0) {
    const dealMid = (dealMin + dealMax) / 2;
    let verdict, level;
    if (myPrice <= dealMin * 1.05) { verdict = '价格优势明显,可冲量'; level = 'good'; }
    else if (myPrice <= dealMax * 1.05) { verdict = '价格在区间内,有竞争力'; level = 'ok'; }
    else if (myPrice <= dealMax * 1.2) { verdict = '价格偏高,建议降到 $' + dealMid.toFixed(2) + ' 以下'; level = 'warn'; }
    else { verdict = '价格远超区间,Deal站难选品'; level = 'bad'; }
    result.deal = { min: dealMin, max: dealMax, mid: dealMid, verdict, level };
  }

  if (fbMin > 0 && fbMax > 0) {
    const fbMid = (fbMin + fbMax) / 2;
    let verdict, level;
    if (myPrice <= fbMin * 1.05) { verdict = '价格优势明显,FB群好爆'; level = 'good'; }
    else if (myPrice <= fbMax * 1.05) { verdict = '价格在区间内,有竞争力'; level = 'ok'; }
    else if (myPrice <= fbMax * 1.2) { verdict = '价格偏高,建议降到 $' + fbMid.toFixed(2) + ' 以下'; level = 'warn'; }
    else { verdict = '价格远超区间,FB群转化会很差'; level = 'bad'; }
    result.fb = { min: fbMin, max: fbMax, mid: fbMid, verdict, level };
  }

  return result;
}

// ============== 适配度评分 ==============
function calcAdaptScore(form, priceCompare) {
  let score = 50;
  const reasons = [];
  const cat = ((form.category || '') + ' ' + (form.categoryDetail || '')).toLowerCase();

  for (const g of ADVISOR_RULES.goldCategories) {
    if (g.keywords.some(k => cat.includes(k.toLowerCase()))) {
      score += g.score;
      reasons.push({ type: 'positive', text: `黄金品类:${g.label} (+${g.score})` });
      break;
    }
  }

  for (const r of ADVISOR_RULES.riskCategories) {
    if (r.keywords.length && r.keywords.some(k => cat.includes(k.toLowerCase()))) {
      score += r.score;
      reasons.push({ type: 'negative', text: `${r.label} (${r.score})` });
    }
  }

  if (form.isFBA === 'fbm') {
    score -= 15;
    reasons.push({ type: 'negative', text: 'FBM类红人发的少 (-15)' });
  }

  const reviews = parseInt(form.reviews) || 0;
  if (reviews >= 200) { score += 10; reasons.push({ type: 'positive', text: `评论充足(${reviews}+) (+10)` }); }
  else if (reviews >= 50) { score += 5; reasons.push({ type: 'positive', text: `评论基础OK(${reviews}) (+5)` }); }
  else if (reviews < 30 && reviews > 0) { score -= 10; reasons.push({ type: 'negative', text: `评论偏少(${reviews}) (-10)` }); }
  else if (reviews === 0 && form.reviews !== '') { score -= 15; reasons.push({ type: 'negative', text: '新品0评论 (-15)' }); }

  const rating = parseFloat(form.rating) || 0;
  if (rating >= 4.5) { score += 8; reasons.push({ type: 'positive', text: `评分优秀(${rating}星) (+8)` }); }
  else if (rating >= 4.0) { score += 4; reasons.push({ type: 'positive', text: `评分良好(${rating}星) (+4)` }); }
  else if (rating < 3.8 && rating > 0) { score -= 12; reasons.push({ type: 'negative', text: `评分偏低(${rating}星) (-12)` }); }

  const bad = parseInt(form.badReviews) || 0;
  if (bad >= 2) { score -= 15; reasons.push({ type: 'negative', text: `首页${bad}条差评 (-15)` }); }

  const discInfo = recommendDiscount(form);
  if (discInfo.actual >= 60) { score += 5; reasons.push({ type: 'positive', text: `折扣强(${discInfo.actual}%) (+5)` }); }
  else if (discInfo.actual > 0 && discInfo.actual < 40) { score -= 10; reasons.push({ type: 'negative', text: `折扣不足40% (-10)` }); }

  // 价格竞争力
  if (priceCompare && priceCompare.deal) {
    if (priceCompare.deal.level === 'good') { score += 8; reasons.push({ type: 'positive', text: 'Deal站价格优势明显 (+8)' }); }
    else if (priceCompare.deal.level === 'bad') { score -= 12; reasons.push({ type: 'negative', text: 'Deal站价格远超区间 (-12)' }); }
    else if (priceCompare.deal.level === 'warn') { score -= 5; reasons.push({ type: 'negative', text: 'Deal站价格偏高 (-5)' }); }
  }
  if (priceCompare && priceCompare.fb) {
    if (priceCompare.fb.level === 'good') { score += 8; reasons.push({ type: 'positive', text: 'FB群价格优势明显 (+8)' }); }
    else if (priceCompare.fb.level === 'bad') { score -= 12; reasons.push({ type: 'negative', text: 'FB群价格远超区间 (-12)' }); }
    else if (priceCompare.fb.level === 'warn') { score -= 5; reasons.push({ type: 'negative', text: 'FB群价格偏高 (-5)' }); }
  }

  return { score: Math.max(0, Math.min(100, score)), reasons };
}

function recommendBudget(form) {
  const price = parseFloat(form.discountPrice) || 0;
  const goal = form.goal;
  let min = 1500, max = 4000;
  if (price <= 20) { min = 1000; max = 3000; }
  else if (price <= 50) { min = 2000; max = 5000; }
  else if (price <= 100) { min = 3500; max = 8000; }
  else { min = 6000; max = 15000; }
  if (goal === 'clearance') { min = Math.round(min * 1.5); max = Math.round(max * 1.5); }
  if (goal === 'ranking') { min = Math.round(min * 1.3); max = Math.round(max * 1.5); }
  return { min, max };
}

function estimateOrders(form, budget) {
  const reviews = parseInt(form.reviews) || 0;
  const rating = parseFloat(form.rating) || 4.0;
  const price = parseFloat(form.discountPrice) || 20;
  const baseRatio = 30 / 3000;
  const priceFactor = Math.max(0.3, Math.min(2, 20/price));
  const ratingFactor = rating >= 4.5 ? 1.2 : rating >= 4.0 ? 1.0 : 0.7;
  const reviewFactor = reviews >= 200 ? 1.2 : reviews >= 50 ? 1.0 : 0.6;
  const factor = priceFactor * ratingFactor * reviewFactor;
  return {
    conservative: Math.round(budget * baseRatio * factor * 0.7),
    optimistic: Math.round(budget * baseRatio * factor * 1.5)
  };
}

function generateAdvice(form) {
  const priceCompare = comparePrices(form);
  const adapt = calcAdaptScore(form, priceCompare);
  const channels = recommendChannels(form);
  const avoidList = buildAvoidList(form);
  const discount = recommendDiscount(form);
  const budget = recommendBudget(form);
  const budgetMid = (budget.min + budget.max) / 2;
  const orders = estimateOrders(form, budgetMid);
  const goal = ADVISOR_RULES.goals[form.goal];

  const warnings = [];
  if (form.goal === 'seckill') warnings.push('⚠ 秒杀注意:发完帖后秒杀前5小时停掉站外折扣,否则会和秒杀折扣叠加亏死');

  return {
    timestamp: new Date().toISOString(),
    form: JSON.parse(JSON.stringify(form)),
    adaptScore: adapt.score,
    adaptReasons: adapt.reasons,
    goal,
    discount,
    priceCompare,
    channels,
    avoidList,
    budget,
    orders,
    warnings
  };
}

function onAdvUrlChange(url) {

  const siteMap = {
    'amazon.com': 'US', 'amazon.ca': 'CA', 'amazon.co.uk': 'UK',
    'amazon.de': 'DE', 'amazon.fr': 'FR', 'amazon.it': 'IT',
    'amazon.es': 'ES', 'amazon.co.jp': 'JP', 'amazon.com.mx': 'MX', 'amazon.com.au': 'AU'
  };
  for (const [domain, code] of Object.entries(siteMap)) {
    if (url.includes(domain)) {
      data.advisorForm.site = code;
      const sel = document.getElementById('adv_site');
      if (sel) sel.value = code;
      break;
    }
  }
  saveData();
}

function updateDiscountHint() {
  const hint = document.getElementById('adv_disc_hint');
  if (!hint) return;
  const orig = parseFloat(data.advisorForm.originalPrice) || 0;
  const disc = parseFloat(data.advisorForm.discountPrice) || 0;
  if (orig <= 0 || disc <= 0) { hint.innerHTML = ''; return; }
  const pct = Math.round((1 - disc/orig) * 100);
  let color = 'var(--success)';
  let msg = '✓ 折扣力度足够,符合大部分FB群门槛(50%)';
  if (pct < 30) { color = 'var(--danger)'; msg = '⚠ 折扣偏低,大部分FB群不收(门槛50%)'; }
  else if (pct < 40) { color = 'var(--warning)'; msg = '折扣偏低,部分渠道有40%门槛'; }
  else if (pct < 50) { color = 'var(--warning)'; msg = '折扣中等,FB质保套餐多数要求50%'; }
  else if (pct >= 60) { color = 'var(--success)'; msg = '✓ 折扣力度强,容易出单'; }
  hint.innerHTML = '<span style="color:' + color + '">折扣率:<strong>' + pct + '% off</strong> · ' + msg + '</span>';
}

function parseAmazonPage() {
  const text = document.getElementById('paste_content').value;
  if (!text || text.length < 100) {
    document.getElementById('paste_result').innerHTML =
      '<div style="color:var(--danger);font-size:13px;padding:10px;background:rgba(231,76,60,0.06);border-radius:6px">⚠ 粘贴内容太少,请确保复制了完整页面</div>';
    return;
  }

  const result = {};

  // 原价:读取页面里第一个出现的 $X.XX 作为原价(折扣价不解析,由用户手填)
  const firstPriceMatch = text.match(/\$\s*([\d,]+\.\d{2})/);
  if (firstPriceMatch) {
    result.originalPrice = parseFloat(firstPriceMatch[1].replace(/,/g, ''));
  }

  // 评分
  const ratingMatch =
    text.match(/([\d.]+)\s*out of\s*5\s*stars/i) ||
    text.match(/([\d.]+)\s*\/\s*5/) ||
    text.match(/平均(?:评分|得分)[^\d]*([\d.]+)/);
  if (ratingMatch) {
    const r = parseFloat(ratingMatch[1]);
    if (r >= 0 && r <= 5) result.rating = r;
  }

  // 评论数
  const reviewMatch =
    text.match(/([\d,]+)\s*(?:global\s+)?ratings/i) ||
    text.match(/([\d,]+)\s*(?:customer\s+)?reviews/i) ||
    text.match(/([\d,]+)\s*条(?:全球)?评分/);
  if (reviewMatch) {
    result.reviews = parseInt(reviewMatch[1].replace(/,/g, ''));
  }

  // FBA检测
  if (/Ships from\s*Amazon|Sold by\s*Amazon|发货:\s*亚马逊|Amazon\.com\b.*Ships from/i.test(text)) {
    result.isFBA = 'fba';
  } else if (/Ships from\s+(?!Amazon)[A-Z][\w\s]+|Sold by\s+(?!Amazon)/i.test(text)) {
    result.isFBA = 'fbm';
  }

  // 类目(从面包屑)
  const breadcrumbMatch = text.match(/(?:Home|首页|主页)\s*[›>»]\s*([^›>»\n]+?)\s*[›>»]/i);
  if (breadcrumbMatch) {
    result.categoryDetail = breadcrumbMatch[1].trim().substring(0, 50);
    // 推断大类
    const cd = result.categoryDetail.toLowerCase();
    if (/kitchen|cookware|home/i.test(cd)) result.category = '家居/厨房';
    else if (/women|dress|beauty|fashion/i.test(cd)) result.category = '女装/服饰/美妆';
    else if (/baby|kids|toy|children/i.test(cd)) result.category = '儿童/母婴/玩具';
    else if (/tools|cleaning/i.test(cd)) result.category = '家庭工具/清洁';
    else if (/pet/i.test(cd)) result.category = '宠物用品';
    else if (/outdoor|garden|patio/i.test(cd)) result.category = '户外/园艺';
    else if (/electronic|computer|cell/i.test(cd)) result.category = '3C/电子';
  }

  // 关键词(从产品标题)
  const titleMatch = text.match(/(?:^|\n)([A-Z][A-Za-z0-9\s\-,&'.()]{20,150})(?:\n|<)/);
  if (titleMatch) {
    const title = titleMatch[1].trim();
    // 取前4-5个单词作为关键词
    const words = title.split(/\s+/).filter(w => w.length > 2 && !/^[A-Z]+$/.test(w)).slice(0, 5);
    if (words.length >= 2) result.productKeywords = words.join(' ');
  }

  // 显示解析结果

function parseDealdealPage() {
  const text = document.getElementById('paste_deal').value;
  if (!text || text.length < 30) {
    document.getElementById('paste_deal_result').innerHTML =
      '<div style="color:var(--danger);font-size:13px;padding:10px;background:rgba(231,76,60,0.06);border-radius:6px">⚠ 内容太少,请确保粘贴了完整搜索结果</div>';
    return;
  }

  // dealdeal.net格式: [N days ago] 产品描述 $X.XX
  const lineRegex = /\[(\d+\s*(?:day|days|week|weeks|hour|hours|month|months)\s*ago)\]\s*([^\$\n]+?)\$([\d.]+)/gi;
  const matches = [];
  let m;
  while ((m = lineRegex.exec(text)) !== null) {
    const price = parseFloat(m[3]);
    if (price > 0 && price < 1000) {
      matches.push({
        time: m[1].trim(),
        product: m[2].trim(),
        price: price
      });
    }
  }

  // 备用:如果上面没匹配到,用更宽松的"$X.XX"
  if (matches.length === 0) {
    const looseRegex = /\$([\d]+\.\d{2})/g;
    while ((m = looseRegex.exec(text)) !== null) {
      const p = parseFloat(m[1]);
      if (p >= 1 && p <= 500) {
        matches.push({ time: '-', product: '-', price: p });
      }
    }
  }

  if (matches.length === 0) {
    document.getElementById('paste_deal_result').innerHTML =
      '<div style="color:var(--warning);font-size:13px;padding:10px;background:rgba(243,156,18,0.06);border-radius:6px">⚠ 没找到价格,请确认粘贴的是 dealdeal.net 搜索结果页(含 [X days ago] $X.XX 格式)</div>';
    return;
  }

  // 计算区间
  const prices = matches.map(x => x.price).sort((a,b) => a-b);
  const min = prices[0];
  const max = prices[prices.length - 1];
  const mid = prices[Math.floor(prices.length/2)];

  window._parsedDealPrices = { min, max, mid, count: matches.length };

  // 显示结果(列出每条找到的)
  let resultHtml = '<div style="background:rgba(39,174,96,0.06);border-left:3px solid var(--success);padding:12px;border-radius:6px">' +
    '<div style="font-weight:600;color:var(--success);margin-bottom:10px">✓ 解析到 ' + matches.length + ' 条价格</div>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px">' +
    '<div><div style="font-size:11px;color:var(--text-muted)">最低</div><div style="font-size:18px;font-weight:700;color:var(--success)">$' + min.toFixed(2) + '</div></div>' +
    '<div><div style="font-size:11px;color:var(--text-muted)">中位</div><div style="font-size:18px;font-weight:700">$' + mid.toFixed(2) + '</div></div>' +
    '<div><div style="font-size:11px;color:var(--text-muted)">最高</div><div style="font-size:18px;font-weight:700;color:var(--orange)">$' + max.toFixed(2) + '</div></div>' +
    '</div>' +
    '<details><summary style="cursor:pointer;font-size:12px;color:var(--text-dim)">查看所有 ' + matches.length + ' 条匹配 ▾</summary>' +
    '<div style="max-height:200px;overflow-y:auto;margin-top:8px;font-size:11px">';
  matches.forEach(x => {
    resultHtml += '<div style="padding:4px 0;border-bottom:1px dashed var(--border)">' +
      '<span style="color:var(--text-muted)">[' + escapeHtml(x.time) + ']</span> ' +
      escapeHtml(x.product.substring(0, 60)) +
      ' <strong style="color:var(--orange)">$' + x.price.toFixed(2) + '</strong></div>';
  });
  resultHtml += '</div></details>' +
    '</div>';
  document.getElementById('paste_deal_result').innerHTML = resultHtml;
  document.getElementById('apply_deal_btn').disabled = false;
}

function parseFbPage() {
  const text = document.getElementById('paste_fb').value;
  if (!text || text.length < 50) {
    document.getElementById('paste_fb_result').innerHTML =
      '<div style="color:var(--danger);font-size:13px;padding:10px;background:rgba(231,76,60,0.06);border-radius:6px">⚠ 内容太少</div>';
    return;
  }

  // 提取所有 $X.XX (含 $X.X 和 $X),并尝试带上下文
  // 上下文取价格前后25个字符,用于让用户判断是不是有效价格
  const priceRegex = /\$\s?([\d]{1,4}(?:\.[\d]{1,2})?)\b/g;
  const found = [];
  let m;
  while ((m = priceRegex.exec(text)) !== null) {
    const price = parseFloat(m[1]);
    if (price < 1 || price > 500) continue; // 排除噪声
    // 获取上下文
    const startCtx = Math.max(0, m.index - 30);
    const endCtx = Math.min(text.length, m.index + m[0].length + 30);
    let ctx = text.substring(startCtx, endCtx).replace(/\s+/g, ' ').trim();
    // 标记价格本身
    ctx = ctx.replace(m[0], '【' + m[0] + '】');

    // 自动判定:如果上下文里出现"原价/Was/原价"等词,标记为可能是原价
    const isOrigPrice = /(原价|Was|Originally|reg\.|\$\d+\s*off)/i.test(ctx);

    found.push({
      price: price,
      context: ctx,
      suggested: !isOrigPrice && price >= 3 && price <= 100, // 默认建议:不是原价、价位合理
      isOrigPrice
    });
  }

  // 去重 (相同价格+相同上下文的合并)
  const seen = new Set();
  const unique = [];
  found.forEach(f => {
    const key = f.price + '|' + f.context;
    if (!seen.has(key)) {
      seen.add(key);
      unique.push(f);
    }
  });

  if (unique.length === 0) {
    document.getElementById('paste_fb_result').innerHTML =
      '<div style="color:var(--warning);font-size:13px;padding:10px;background:rgba(243,156,18,0.06);border-radius:6px">⚠ 没找到 $X.XX 价格</div>';
    return;
  }

  window._parsedFbItems = unique;

  let html = '<div style="background:rgba(248,137,6,0.06);border-left:3px solid var(--orange);padding:12px;border-radius:6px">' +
    '<div style="font-weight:600;color:var(--orange);margin-bottom:8px">找到 ' + unique.length + ' 个价格,请勾选<strong>有效折扣价</strong>(已自动剔除疑似原价):</div>' +
    '<div style="max-height:280px;overflow-y:auto;background:white;padding:8px;border-radius:4px">';

  unique.forEach((item, i) => {
    const checked = item.suggested ? 'checked' : '';
    const badge = item.isOrigPrice ? '<span style="color:var(--danger);font-size:10px;margin-left:6px">(疑似原价)</span>' : '';
    html += '<label style="display:flex;align-items:flex-start;padding:6px;border-bottom:1px solid var(--border);cursor:pointer;font-size:12px">' +
      '<input type="checkbox" id="fb_item_' + i + '" ' + checked + ' style="margin-right:8px;margin-top:3px;flex-shrink:0">' +
      '<div style="flex:1">' +
      '<strong style="color:var(--orange)">$' + item.price.toFixed(2) + '</strong>' + badge +
      '<div style="color:var(--text-dim);margin-top:2px;font-family:monospace">…' + escapeHtml(item.context) + '…</div>' +
      '</div>' +
      '</label>';
  });

  html += '</div>' +
    '<div style="margin-top:10px;display:flex;gap:8px;align-items:center;font-size:11px;color:var(--text-muted)">' +
    '💡 提示:勾选的价格会取最低-最高作为区间。' +
    '<button class="btn btn-secondary btn-sm" onclick="fbCheckAll(true)" style="font-size:11px;padding:3px 8px">全选</button>' +
    '<button class="btn btn-secondary btn-sm" onclick="fbCheckAll(false)" style="font-size:11px;padding:3px 8px">全不选</button>' +
    '</div>' +
    '</div>';
  document.getElementById('paste_fb_result').innerHTML = html;
  document.getElementById('apply_fb_btn').disabled = false;
}

function fbCheckAll(state) {
  const items = window._parsedFbItems || [];
  for (let i = 0; i < items.length; i++) {

  // 总分
  html += '<div class="card" style="background:linear-gradient(135deg,rgba(95,195,231,0.06),rgba(248,137,6,0.06))">' +
    '<div style="display:flex;align-items:center;gap:24px">' +

    '<div style="font-size:48px;font-weight:700;color:' + scoreColor + ';line-height:1">' + r.adaptScore + '</div>' +

    html += '<div style="font-size:12px;color:' + c + ';margin-bottom:3px">' + (rs.type === 'positive' ? '+ ' : '- ') + escapeHtml(rs.text) + '</div>';
  });
  html += '</div></div></div>';

  // ⚠ 不投清单 - 重要,放最前面
  if (r.avoidList && r.avoidList.length > 0) {
    const critical = r.avoidList.filter(a => a.severity === 'critical');
    const high = r.avoidList.filter(a => a.severity === 'high');
    const medium = r.avoidList.filter(a => a.severity === 'medium');

    html += '<div class="card" style="border-left:4px solid var(--danger)">' +
      '<div class="card-title" style="display:flex;justify-content:space-between"><span style="color:var(--danger)">❌ 不投清单(' + r.avoidList.length + '项)</span><span style="font-size:11px;color:var(--text-muted);text-transform:none;letter-spacing:0">避坑优先,这些渠道这次别投</span></div>' +

      '基于产品特征命中规则,共识别出 <strong style="color:var(--danger)">' + critical.length + ' 项严重</strong> · ' +
      '<strong style="color:var(--warning)">' + high.length + ' 项高风险</strong> · ' +
      '<strong style="color:var(--text)">' + medium.length + ' 项中等</strong>。' +
      '请重点关注严重和高风险项,这些渠道<strong>下单后可能直接被拒</strong>。' +

    if (critical.length > 0) {
      html += '<div style="font-size:11px;color:var(--danger);text-transform:uppercase;letter-spacing:1px;font-weight:600;margin-bottom:8px;margin-top:6px">严重(完全不投)</div>';

    if (high.length > 0) {

  const orig = parseFloat(f.originalPrice) || 0;
  const dprice = parseFloat(f.discountPrice) || 0;
  const discount = orig > 0 ? Math.round((1 - dprice/orig) * 100) : 0;

  // 评分维度评估

function copyAdvisorResult() {
  const r = data.advisorResult;
  if (!r) return;
  const f = r.form;

  let text = '【Snow123 投前建议】\n';
  text += '时间:' + new Date(r.timestamp).toLocaleString('zh-CN') + '\n';
  text += 'ASIN: ' + (f.asin || '-') + ' (' + f.site + ')\n';
  text += '类目: ' + (f.category || '-') + ' / ' + (f.categoryDetail || '-') + '\n';
  text += '价格: $' + f.discountPrice + (f.originalPrice ? ' (原价 $' + f.originalPrice + ', ' + r.discount.actual + '%off)' : '') + '\n';
  text += '评论: ' + (f.reviews || '-') + ' / ' + (f.rating || '-') + '★\n';
  text += '配送: ' + (f.isFBA === 'fba' ? 'FBA' : 'FBM') + '\n';
  text += '目标: ' + r.goal.label + '\n\n';

  text += '━━━ 适配度: ' + r.adaptScore + '/100 ━━━\n';
  r.adaptReasons.forEach(rs => text += (rs.type === 'positive' ? '+ ' : '- ') + rs.text + '\n');

  if (r.avoidList && r.avoidList.length) {
    text += '\n━━━ ❌ 不投清单 ━━━\n';
    r.avoidList.forEach(a => {
      const m = a.severity === 'critical' ? '❌' : a.severity === 'high' ? '⚠' : '▴';
      text += m + ' ' + a.channel + '\n  原因: ' + a.reason + '\n';
    });
  }

  if (r.priceCompare) {
    if (r.priceCompare.deal) {
      text += '\n━━━ Deal站价格 ━━━\n';
      text += '竞品: $' + r.priceCompare.deal.min + '-$' + r.priceCompare.deal.max + '\n';
      text += '你的: $' + r.priceCompare.myPrice + ' · ' + r.priceCompare.deal.verdict + '\n';
    }
    if (r.priceCompare.fb) {
      text += '\n━━━ FB群价格 ━━━\n';
      text += '竞品: $' + r.priceCompare.fb.min + '-$' + r.priceCompare.fb.max + '\n';
      text += '你的: $' + r.priceCompare.myPrice + ' · ' + r.priceCompare.fb.verdict + '\n';
    }
  }

  text += '\n━━━ ✓ 推荐渠道 ━━━\n';
  text += '【核心】\n';
  r.channels.filter(c => c.priority === 1).forEach(c => text += '· ' + c.tier + '\n  ' + c.reason + '\n');
  const p2 = r.channels.filter(c => c.priority === 2);
  if (p2.length) { text += '【补充】\n'; p2.forEach(c => text += '· ' + c.tier + '\n  ' + c.reason + '\n'); }

  navigator.clipboard.writeText(text).then(() => alert('已复制!'))
    .catch(() => prompt('请手动复制:', text));
}

// ============== 扩展导入(从URL hash读取) ==============
function tryImportFromExtension() {
  const hash = window.location.hash;
  if (!hash || hash.indexOf('snow123_import=') === -1) return false;

  try {
    const payload = hash.split('snow123_import=')[1];
    const decoded = decodeURIComponent(escape(atob(payload)));
    const obj = JSON.parse(decoded);
    if (!obj || obj.v !== 1) return false;

    // 确保advisorForm存在
    if (!data.advisorForm) {
      data.advisorForm = {
        productUrl: '', asin: '', site: 'US',
        discountPrice: '', originalPrice: '',
        category: '', categoryDetail: '',
        reviews: '', rating: '', badReviews: '',
        goal: 'sustained', isFBA: 'fba',
        productKeywords: '',
        dealsitePriceMin: '', dealsitePriceMax: '',
        fbPriceMin: '', fbPriceMax: ''
      };
    }
    const f = data.advisorForm;
    const imported = [];

    // Amazon数据
    if (obj.amazon) {
      const a = obj.amazon;
      if (a.url) { f.productUrl = a.url; imported.push('链接'); }
      if (a.asin) { f.asin = a.asin; imported.push('ASIN'); }
      if (a.site) f.site = a.site;
      if (a.originalPrice) { f.originalPrice = a.originalPrice; imported.push('原价'); }
      if (a.rating) { f.rating = a.rating; imported.push('评分'); }
      if (a.reviews !== undefined && a.reviews !== null) { f.reviews = a.reviews; imported.push('评论数'); }
      if (a.isFBA) { f.isFBA = a.isFBA; imported.push('FBA/FBM'); }
      if (a.category) { f.category = a.category; imported.push('类目'); }
      if (a.categoryDetail) f.categoryDetail = a.categoryDetail;
      if (a.selectedKeyword) { f.productKeywords = a.selectedKeyword; imported.push('关键词'); }
      else if (a.keywordCandidates && a.keywordCandidates[0]) f.productKeywords = a.keywordCandidates[0];
    }
    // Deal数据
    if (obj.deal) {
      f.dealsitePriceMin = obj.deal.min;
      f.dealsitePriceMax = obj.deal.max;
      imported.push('Deal站价格区间');
    }
    // FB数据
    if (obj.fb) {
      f.fbPriceMin = obj.fb.min;
      f.fbPriceMax = obj.fb.max;
      imported.push('FB价格区间');
    }

    saveData();
    // 清掉hash
    history.replaceState(null, '', window.location.pathname + window.location.search);
    // 跳转到投前建议-新建页
    setTimeout(() => {
      navigate('advNew');
      setTimeout(() => {
        alert('✓ 从扩展导入成功!\n\n已自动填入:' + imported.join(' / '));
      }, 200);
    }, 100);
    return true;
  } catch (e) {
    console.error('导入失败:', e);
    alert('扩展数据导入失败:' + e.message);
    return false;
  }
}

// 初始化
tryImportFromExtension();
render();


</script>
</body>
</html>
